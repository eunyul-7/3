<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한밤의 사건 파일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 수사 수첩 — 상단 상황판(남은 턴), 탭 네비, 본문은 현장 평면도 + 조사 패널 */
:root {
  --bg: #11171c;
  --surface: #19222a;
  --surface-2: #212c35;
  --line: #2f3d48;
  --ink: #dbe3e8;
  --muted: #8395a2;
  --lamp: #e2b25c;
  --lamp-dim: #6b5530;
  --blood: #d06a5c;
  --ok: #7fb59a;
  --f-display: "Gowun Batang", "Nanum Myeongjo", "Batang", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; position: relative; z-index: 1; }
body.playing .wrap { max-width: 1280px; gap: 12px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 46px); letter-spacing: -0.01em; }
h2 { font-size: 24px; }
h3 { font-size: 18px; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

#rain { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .35; }
@media (prefers-reduced-motion: reduce) { #rain { display: none; } }

.btn { background: var(--lamp); color: #1a1408; border: 0; border-radius: 4px; padding: 11px 20px; font-weight: 600; justify-self: start; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--lamp); border: 1px solid var(--lamp-dim); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* 사건 목록 */
.files { display: grid; gap: 22px; padding-block: 24px; }
.files .lede { font-family: var(--f-display); font-size: 18px; max-width: 60ch; }
.file-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.file {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; text-align: left;
  padding: 16px; display: grid; gap: 6px; align-content: start;
}
.file:hover { border-color: var(--lamp-dim); }
.file .no { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.file b { font-family: var(--f-display); font-size: 20px; }
.file .where { color: var(--muted); font-size: 13.5px; }
.stamp { justify-self: start; font-family: var(--f-mono); font-size: 12px; border-radius: 3px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); }
.stamp.solved { border-color: var(--lamp-dim); color: var(--lamp); }
.rules { display: grid; gap: 8px; max-width: 64ch; color: var(--muted); }
.rules b { color: var(--ink); font-weight: 600; }

/* 브리핑 */
.intro { display: grid; gap: 22px; padding-block: 24px; }
.intro .lede { font-family: var(--f-display); font-size: 18px; max-width: 60ch; }
.intro .brief { display: grid; gap: 10px; max-width: 62ch; color: var(--muted); }
.cast { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.cast .person { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 2px; }
.cast .person b { font-family: var(--f-display); font-size: 17px; }
.cast .person span { color: var(--muted); font-size: 13.5px; }

/* 상황판 */
.board { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: grid; gap: 12px; padding-block: 12px; }
.board-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.board-top h2 { font-size: 22px; }
.clock { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pips { display: flex; flex-wrap: wrap; gap: 3px; max-width: 280px; }
.pip { width: 6px; height: 14px; border-radius: 1px; background: var(--lamp); }
.pip.used { background: var(--line); }
.clock .mono { font-size: 13px; color: var(--muted); }
.clock .mono b { color: var(--lamp); font-weight: 500; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 6px 12px; color: var(--muted); font-size: 14px; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--line); background: var(--surface); }
.tab:disabled { opacity: .4; cursor: not-allowed; }
.tab .count { font-family: var(--f-mono); font-size: 11px; color: var(--lamp); margin-left: 4px; }
.tab.quit { margin-left: auto; }

/* 평면도 */
.split { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 20px; }
@media (max-width: 720px) { .split { grid-template-columns: minmax(0, 1fr); } }
.plan { display: grid; gap: 14px; }
.floor { display: grid; gap: 6px; }
.floor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; border: 1px solid var(--line); padding: 4px; border-radius: 3px; }
.room { background: var(--surface); border: 1px solid transparent; border-radius: 2px; padding: 10px; text-align: left; min-height: 64px; display: grid; align-content: space-between; gap: 4px; }
.room:hover { border-color: var(--line); }
.room[aria-pressed="true"] { border-color: var(--lamp); background: var(--surface-2); }
.room .rname { font-family: var(--f-display); font-size: 15px; }
.room .rstat { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.room.crime .rname::after { content: " ✕"; color: var(--blood); }
.room.wide { grid-column: span 2; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.panel .desc { color: var(--muted); max-width: 62ch; }
.spots { display: grid; gap: 10px; }
.spot { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.spot-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.spot-head b { font-weight: 600; }
.act { background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 5px 12px; font-size: 13.5px; }
.act:hover:not(:disabled) { border-color: var(--lamp); color: var(--lamp); }
.act:disabled { opacity: .45; cursor: not-allowed; }
.act.press { border-color: var(--blood); color: var(--blood); }
.act.press:hover:not(:disabled) { border-color: var(--blood); color: var(--ink); background: var(--blood); }
.act .cost { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 6px; }
.result { font-family: var(--f-display); font-size: 15.5px; line-height: 1.75; max-width: 64ch; }
.found-chip.fake { color: var(--muted); border-color: var(--line); }
.found-chip { display: inline-flex; align-items: center; gap: 6px; justify-self: start; font-family: var(--f-mono); font-size: 12px; color: var(--lamp); border: 1px solid var(--lamp-dim); border-radius: 999px; padding: 2px 10px; }

/* 심문 */
.people { display: grid; gap: 6px; }
.who { background: var(--surface); border: 1px solid transparent; border-radius: 3px; text-align: left; padding: 10px 12px; display: grid; gap: 2px; }
.who:hover { border-color: var(--line); }
.who[aria-pressed="true"] { border-color: var(--lamp); }
.who b { font-family: var(--f-display); font-size: 16px; }
.who span { font-size: 13px; color: var(--muted); }
.qa { display: grid; gap: 14px; }
.q { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.q .ask { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.q .ask .text { font-weight: 500; }
.q .tag { font-family: var(--f-mono); font-size: 11px; color: var(--lamp); }
.answer { font-family: var(--f-display); font-size: 15.5px; line-height: 1.75; border-left: 2px solid var(--lamp-dim); padding-left: 12px; max-width: 64ch; }
.answer.retracted { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--blood); }
.answer.broken { border-left-color: var(--blood); }
.answer.deflect { border-left-color: var(--line); color: var(--muted); font-size: 14.5px; }
.verdict-tag { font-family: var(--f-mono); font-size: 11px; color: var(--blood); letter-spacing: .08em; }
.present { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface-2); border: 1px dashed var(--blood); border-radius: 3px; padding: 10px; }
.present label { font-size: 13.5px; color: var(--muted); }
.present select { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px; max-width: 100%; min-width: 0; }
.q-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.locked { color: var(--muted); font-size: 13.5px; }

/* 수첩 */
.notes { display: grid; gap: 20px; margin-top: 20px; }
.clue-list { display: grid; gap: 10px; }
.clue { background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; display: grid; gap: 4px; }
.clue .meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.clue b { font-family: var(--f-display); font-size: 16px; }
.clue p { color: var(--muted); font-size: 14px; }
.timeline { display: grid; border-left: 1px solid var(--line); margin-left: 6px; }
.tl { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 6px 0 6px 14px; position: relative; }
.tl::before { content: ""; position: absolute; left: -4px; top: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--lamp-dim); }
.tl .t { font-family: var(--f-mono); font-size: 13px; color: var(--lamp); }
.tl .src { color: var(--muted); font-size: 12.5px; }
.tl.false .e { text-decoration: line-through; text-decoration-color: var(--blood); color: var(--muted); }
.tl.false::before { background: var(--blood); }
.empty { color: var(--muted); font-style: italic; }

/* 지목 */
.accuse { display: grid; gap: 22px; margin-top: 20px; }
fieldset { border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px 16px; margin: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-family: var(--f-display); font-weight: 700; font-size: 17px; padding: 0 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 6px 4px; border-radius: 3px; cursor: pointer; }
.opt:hover { background: var(--surface-2); }
.opt input { accent-color: var(--lamp); margin-top: 5px; }
.hint { color: var(--muted); font-size: 13.5px; }

/* 결과 */
.verdict { display: grid; gap: 18px; padding-block: 24px; }
.grade { font-family: var(--f-display); font-size: 64px; line-height: 1; color: var(--lamp); }
.grade.fail { color: var(--blood); }
.score-rows { display: grid; gap: 6px; max-width: 520px; }
.score-row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.score-row .ok { color: var(--ok); } .score-row .no { color: var(--blood); }
.truth { display: grid; gap: 12px; max-width: 66ch; font-family: var(--f-display); font-size: 16px; line-height: 1.8; }

/* 타이틀 */
.title { display: grid; gap: 26px; padding-block: 32px 8px; }
.title h1 { font-size: clamp(40px, 10vw, 76px); line-height: 1.05; letter-spacing: -0.02em; }
.title h1 span { color: var(--lamp); }
.title .lede { font-family: var(--f-display); font-size: 18px; max-width: 56ch; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.howto div { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; align-content: start; }
.howto b { font-family: var(--f-display); font-size: 16px; }
.howto b .k { font-family: var(--f-mono); font-size: 11px; color: var(--lamp); margin-right: 6px; letter-spacing: .08em; }
.howto p { color: var(--muted); font-size: 14px; }
.howto .warn b .k { color: var(--blood); }
.sound-btn { background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; color: var(--muted); font-size: 13.5px; }
.sound-btn[aria-pressed="true"] { color: var(--lamp); border-color: var(--lamp-dim); }

/* 훼방 · 긴박 */
.alerts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.alert { font-family: var(--f-mono); font-size: 12px; color: var(--blood); border: 1px solid var(--blood); border-radius: 3px; padding: 2px 8px; }
.urgent .pip:not(.used) { background: var(--blood); }
.urgent .clock .mono b { color: var(--blood); }
@media (prefers-reduced-motion: no-preference) {
  .urgent .clock .mono b { animation: pulse 1s ease-in-out infinite; }
  .urgent .timer b { animation: pulse .5s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 30; background: var(--ink); opacity: 0; }
  #flash.on { animation: flash .9s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 8% { opacity: .35; } 16% { opacity: .05; } 24% { opacity: .25; } 100% { opacity: 0; } }
}
.locked-room { color: var(--blood); font-family: var(--f-display); }
.spot .tampered { font-family: var(--f-mono); font-size: 11px; color: var(--blood); }
.room.is-locked .rstat { color: var(--blood); }
.who.is-silent span.mono { color: var(--blood); }
.event-log { display: grid; gap: 6px; }
.event-log p { color: var(--muted); font-size: 14px; border-left: 2px solid var(--blood); padding-left: 10px; }
.event-log p.good { border-left-color: var(--ok); }
.setup { max-width: 640px; }
.alert.ally { color: var(--ok); border-color: var(--ok); }
.verdict-tag.ally { color: var(--ok); }
.answer.rebut { border-left-color: var(--ok); font-size: 15px; }
.side-label { margin-top: 10px; color: var(--blood); }
.dispatch { border-top: 1px dashed var(--ok); padding-top: 12px; display: grid; gap: 8px; }
.dispatch b { font-weight: 600; color: var(--ok); }
.act.ally:hover:not(:disabled) { border-color: var(--ok); color: var(--ok); }
.setup .opt b { color: var(--ink); }
.timer { color: var(--muted); }
.timer b { color: var(--lamp); font-weight: 500; }
.urgent .timer b { color: var(--blood); }
.diff-chip { font-family: var(--f-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 7px; }
/* 걸어 다니는 지도 */
.view3d { position: relative; border-radius: 6px; overflow: hidden; background: #0b0e12; border: 2px solid #12161a; box-shadow: 0 10px 30px rgba(0,0,0,.45); min-height: 180px; }
.view3d canvas { display: block; width: 100%; touch-action: none; cursor: grab; outline: none; }
.view3d canvas:active { cursor: grabbing; }
.view3d canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--lamp); }
.crosshair { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; border: 2px solid rgba(255,240,210,.8); pointer-events: none; z-index: 2; }
.view3d .map-lock { position: absolute; }
.v3-fail { padding: 30px 16px; color: var(--muted); text-align: center; }
.mode-btns { display: flex; gap: 4px; }
.mode-btns .act.on { border-color: var(--lamp); color: var(--lamp); }
.room-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.map { position: relative; width: 100%; aspect-ratio: 11 / 8; border-radius: 6px; overflow: hidden; outline: none; touch-action: manipulation; cursor: pointer;
  border: 2px solid #12161a; box-shadow: 0 10px 30px rgba(0,0,0,.45); background-color: #3d3027; }
.map.floor-wood { background-color: #4a3727;
  background-image: repeating-linear-gradient(180deg, rgba(0,0,0,.0) 0 calc(100% / 16 - 1px), rgba(0,0,0,.28) calc(100% / 16 - 1px) calc(100% / 16)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 7%, rgba(0,0,0,.05) 7% 14%, rgba(255,255,255,.02) 14% 23%); }
.map.floor-tile { background-color: #5b6066;
  background-image: conic-gradient(#666b71 25%, #50555b 0 50%, #666b71 0 75%, #50555b 0); background-size: calc(100% / 11) calc(100% / 8); }
.map.floor-carpet { background-color: #3a3346;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px), radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.5px);
  background-size: 9px 9px, 13px 13px; background-position: 0 0, 4px 5px; }
.map:focus-visible { box-shadow: 0 0 0 2px var(--lamp), 0 10px 30px rgba(0,0,0,.45); }
.wall { position: absolute; z-index: 1; }
.wall.top { background: linear-gradient(180deg, #232a31 0 55%, #47515b 55% 88%, #2a2219 88% 100%); }
.wall.bottom { background: linear-gradient(180deg, #1c2227, #11161a); }
.wall.side { background: linear-gradient(90deg, #1b2025, #262d34); }
.wall.side.r { background: linear-gradient(270deg, #1b2025, #262d34); }
.wall-deco { position: absolute; z-index: 1; pointer-events: none; }
.wall-deco.frame { background: #6f7f72; border: 3px solid #b48d4c; box-shadow: 0 2px 3px rgba(0,0,0,.5); }
.wall-deco.sconce { border-radius: 50% 50% 4px 4px; background: radial-gradient(circle at 50% 70%, #ffe7a8, #e2b25c 45%, #8a6a2e); box-shadow: 0 0 14px 6px rgba(255,214,140,.35); }
.floor-rug { position: absolute; background: var(--rug); border-radius: 4px; box-shadow: inset 0 0 0 4px rgba(0,0,0,.18), inset 0 0 0 6px rgba(216,180,106,.35), 0 2px 4px rgba(0,0,0,.3); opacity: .85; }
.obj, .npc, .door, .deco, .me { position: absolute; padding: 0; border: 0; background: none; }
.obj { cursor: pointer; }
.obj-art, .deco { display: block; }
.obj-art { width: 100%; height: 100%; transform: scale(1.14); transition: transform .15s; }
.obj svg, .deco svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 2px rgba(0,0,0,.5)); }
.deco svg { transform: scale(1.1); }
.obj:hover .obj-art, .obj:focus-visible .obj-art { transform: scale(1.24); }
.obj:focus-visible { outline: 2px solid var(--lamp); outline-offset: 1px; border-radius: 4px; }
.obj .mark { position: absolute; z-index: 6; left: 50%; top: -34%; transform: translateX(-50%); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  display: grid; place-items: center; font: 700 11px/1 var(--f-mono); background: var(--lamp); color: #1a1408; box-shadow: 0 2px 4px rgba(0,0,0,.5); }
.obj .mark::after { content: ""; position: absolute; left: 50%; bottom: -4px; margin-left: -4px; border: 4px solid transparent; border-bottom: 0; border-top-color: var(--lamp); }
.obj.done .mark { top: -8%; left: auto; right: -6%; transform: none; min-width: 13px; height: 13px; font-size: 9px; background: var(--ok); }
.obj.done .mark::after { display: none; }
.obj.tam .mark { background: var(--blood); color: #fff; }
.obj.tam .mark::after { border-top-color: var(--blood); }
.obj.done .obj-art { opacity: .72; }
.npc { z-index: 2; display: grid; place-items: center; cursor: pointer; }
.npc::before, .me .shadow { content: ""; position: absolute; left: 18%; right: 18%; bottom: 2%; height: 16%; border-radius: 50%; background: rgba(0,0,0,.45); filter: blur(1px); }
.npc .face, .me .face { width: 80%; height: 80%; position: relative; }
.npc .face { border: 2px solid #e9e4da; box-shadow: 0 3px 6px rgba(0,0,0,.5); }
.npc.silent .face { border-color: var(--blood); filter: grayscale(.6); }
.npc .nm { position: absolute; z-index: 6; top: 94%; left: 50%; transform: translateX(-50%); font-size: clamp(8px, 1.6vw, 11px); white-space: nowrap; color: var(--ink);
  background: rgba(10,14,18,.82); padding: 1px 5px; border-radius: 3px; pointer-events: none; }
.door { z-index: 2; cursor: pointer; overflow: visible; display: grid; place-items: center;
  background: linear-gradient(180deg, #7a5a3c, #5a4029); box-shadow: inset 0 0 0 3px #3a2a1b; }

/* =====================================================================

const CASES = [
/* ------------------------------------------------------------------ */
{

  clues: {

const jo = (w, a, b) => { const ch = w.charCodeAt(w.length - 1); return w + ((ch >= 0xAC00 && ch <= 0xD7A3 && (ch - 0xAC00) % 28) ? a : b); };
const I = w => jo(w, "이", "가"), EUN = w => jo(w, "은", "는"), EUL = w => jo(w, "을", "를"), WA = w => jo(w, "과", "와");
const RND = {
  pick: a => a[Math.floor(Math.random() * a.length)],
  shuffle: a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  int: (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1)),
};

const LAST_BIAS = { 정: "f", 주: "f", 경: "f", 인: "f", 서: "f" };

  const ch = [...name].filter(c => /[가-힣]/.test(c));
  if (!ch.length) return "m";
  const given = ch.length >= 3 ? ch.slice(-2) : ch;   /* 세 글자면 성을 뺀다 */
  const last = given[given.length - 1], first = given.length > 1 ? given[0] : "";

  const lv = "민진현원빈".includes(last) ? "" : LAST_BIAS[last] || (NAME_LAST.f.includes(last) && !NAME_LAST.m.includes(last) ? "f" : NAME_LAST.m.includes(last) && !NAME_LAST.f.includes(last) ? "m" : "");
  if (lv) sc += lv === "f" ? 2 : -2;

  for (const m of [S.locks, S.silence]) for (const k in m) { m[k] -= n; if (m[k] <= 0) { delete m[k]; if (m === S.silence && S.counter) delete S.counter[k]; } }

/* ---------- 동료의 자동 도움: 어려울수록 자주 ---------- */

/* ---------- 팀원 출동: 장소에 보내면 턴을 쓰지 않고 대신 조사 ---------- */

  const tamperable = spots.filter(s => s.clue && !has(S.searched, s.id) && !has(S.tampered, s.id));
  const lockable = Object.keys(c.rooms).filter(rid => !S.locks[rid] && c.rooms[rid].spots.some(s => !has(S.searched, s.id)));

  } else if (kind === "lock") {

const toastQ = []; let toastBusy = false;
function toast(html, bad) { toastQ.push([html, bad]); if (!toastBusy) nextToast(); }
function nextToast() {
  const t = document.getElementById("toast"), item = toastQ.shift();

  function bg() {

    bgc = pxCanvas(W, H); const b = bgc.getContext("2d");
    const fl = floorTile("tile", {}), wl = wallTile({ wall: "panel", wallC: "#4d5a66" }, 0);
    for (let y = 0; y < 8; y++) for (let x = 0; x < 11; x++) b.drawImage(y < 2 ? wl : fl, x * TS, y * TS);
    b.fillStyle = "#151a1f"; b.fillRect(5 * TS + 2, H - 4, TS - 4, 4);   /* 출입문 */

      if (talking && talking.who === p.name && !out) dy = Math.floor(t * 6) % 2 ? -1 : 0;
      if (p.player && !out && t >= 11 && t < 13.6) dy = Math.floor(t * 6) % 2 ? -1 : 0;
      return { p, x, y, dir, moving, dy };
    }).filter(e => e.y < 9.2).sort((a, b) => a.y - b.y);
    for (const e of ents) {
      const sp = charSprites(e.p.name, "", !!e.p.player), f = e.moving ? [0, 1, 0, 2][Math.floor(t * 8) % 4] : 0;

/* 용의자·변수 인물을 방에 배치: 이름이 붙은 방엔 그 사람, 나머지는 공용 공간에 */
function roomPeople(rid) {
  const c = C(), rooms = Object.keys(c.rooms), out = {};
  rooms.forEach(r => (out[r] = []));
  const owner = r => Object.entries(c.suspects).find(([, p]) => c.rooms[r].name.includes(p.name));
  const placed = new Set();
  for (const r of rooms) { const o = owner(r); if (o) { out[r].push({ kind: "s", id: o[0], name: o[1].name, role: o[1].role }); placed.add(o[0]); } }
  const free = rooms.filter(r => !c.rooms[r].crime && !owner(r));
  const pool = free.length ? free : rooms.filter(r => !c.rooms[r].crime);
  let k = 0;
  for (const [sid, p] of Object.entries(c.suspects)) if (!placed.has(sid)) out[pool[k++ % pool.length]].push({ kind: "s", id: sid, name: p.name, role: p.role });
  S.vars.forEach((v, i) => out[pool[k++ % pool.length]].push({ kind: "v", id: "v" + i, name: v.name, role: v.role }));
  return out[rid] || [];
}
/* 같은 층 방은 아래쪽 문으로, 다른 층은 왼쪽 계단으로 */
function doorsOf(rid) {
  const c = C(), fl = c.floors.find(f => f.rooms.includes(rid)), out = [];
  fl.rooms.filter(r => r !== rid).slice(0, 3).forEach((r, i) => out.push({ to: r, x: [2, 5, 8][i], y: EXH - 1, side: "b" }));
  c.floors.filter(f => f !== fl).forEach((f, i) => out.push({ to: f.rooms[0], x: 0, y: 2 + i * 2, side: "l", stairs: f.label }));
  return out;
}
function layout(rid) {
  const key = `${S.caseId}|${C().title}|${rid}|${S.vars.map(v => v.name).join()}|${S.fakeSeed}`;
  if (layoutCache.has(key)) return layoutCache.get(key);
  const r = C().rooms[rid], h = hashStr(rid + C().title), taken = new Set(), k = (x, y) => x + "," + y;
  const doors = doorsOf(rid);
  doors.forEach(d => taken.add(d.side === "b" ? k(d.x, EXH - 2) : k(1, d.y)));
  taken.add(k(5, 6));
  const rot = a => { const o = h % a.length; return a.slice(o).concat(a.slice(0, o)); };
  const take = slots => { for (const [x, y] of slots) if (!taken.has(k(x, y))) { taken.add(k(x, y)); return [x, y]; } return null; };
  const anyFree = () => { for (let y = 2; y < EXH - 2; y++) for (let x = 2; x < EXW - 2; x++) if (!taken.has(k(x, y))) { taken.add(k(x, y)); return [x, y]; } return [5, 3]; };
  const items = allSpots(rid).map(sp => {
    const t = sp.type || furnType(sp.label);
    const pos = take(rot(WALL_T.has(t) ? WALL_SLOTS : CENTER_T.has(t) ? CENTER_SLOTS : CORNER_SLOTS)) || anyFree();
    return { spot: sp.id, type: t, x: pos[0], y: pos[1], label: sp.label };
  });
  const people = roomPeople(rid).map(pp => { const pos = take(rot(PERSON_SLOTS)) || anyFree(); return { ...pp, x: pos[0], y: pos[1] }; });
  const deco = [];
  const pl = take(rot(CORNER_SLOTS)); if (pl) deco.push({ type: "plant", x: pl[0], y: pl[1] });
  const L = { items, people, deco, doors };

}
const at = (L, x, y) => L.items.find(o => o.x === x && o.y === y) || L.people.find(o => o.x === x && o.y === y) || L.deco.find(o => o.x === x && o.y === y);
const doorAt = (L, x, y) => L.doors.find(d => d.x === x && d.y === y);
const walkable = (L, x, y) => (x >= 1 && x <= EXW - 2 && y >= 1 && y <= EXH - 2 && !at(L, x, y)) || !!doorAt(L, x, y);
const NB = [[0, -1], [1, 0], [0, 1], [-1, 0]];
function findPath(L, from, goals) {
  const key = (x, y) => x + "," + y, goal = new Set(goals.map(([x, y]) => key(x, y)));
  if (goal.has(key(from.x, from.y))) return [];
  const prev = new Map([[key(from.x, from.y), null]]), q = [[from.x, from.y]];
  while (q.length) {
    const [x, y] = q.shift();
    for (const [dx, dy] of NB) {
      const nx = x + dx, ny = y + dy, nk = key(nx, ny);
      if (prev.has(nk) || !walkable(L, nx, ny)) continue;
      if (doorAt(L, nx, ny) && !goal.has(nk)) continue;   /* 문은 목적지일 때만 지나간다 */
      prev.set(nk, [x, y]);
      if (goal.has(nk)) { const path = [[nx, ny]]; let c = [x, y]; while (c && key(...c) !== key(from.x, from.y)) { path.unshift(c); c = prev.get(key(...c)); } return path; }

}
function ensurePos() {
  if (!S.pos || S.pos.room !== S.room) S.pos = { room: S.room, x: 5, y: 6 };
}
function doSearch(id) {
  const rid = Object.keys(C().rooms).find(k => allSpots(k).some(s => s.id === id));
  const sp = rid && allSpots(rid).find(s => s.id === id);
  if (!sp || S.turns <= 0 || has(S.searched, sp.id) || S.locks[rid]) return false;
  Sound.step(); S.searched.push(sp.id);
  if (has(S.lost || [], sp.id)) toast("한발 늦었다 — 누군가 이미 치워 버렸다. 단서를 놓쳤다.", true);
  else addClue(sp.clue);
  if (sp.fake) toast("헛수고 — 사건과 관계없는 물건이었다.", true);
  spend(has(S.tampered, sp.id) ? 2 : 1);
  return true;
}

/* ---------- 픽셀 도구 ---------- */
const pxCanvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const hexRgb = h => { const n = parseInt(String(h).replace("#", ""), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const shadeHex = (h, k) => { const [r, g, b] = hexRgb(h), f = v => Math.max(0, Math.min(255, Math.round(v * k))); return `rgb(${f(r)},${f(g)},${f(b)})`; };

  const g = cv.getContext("2d"), w = cv.width, h = cv.height, img = g.getImageData(0, 0, w, h), d = img.data, o = new Uint8ClampedArray(d), [r, gg, b] = hexRgb(color);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4; if (d[i + 3] > 0) continue;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      if (d[(ny * w + nx) * 4 + 3] > 0) { o[i] = r; o[i + 1] = gg; o[i + 2] = b; o[i + 3] = 255; break; }
    }
  }
  g.putImageData(new ImageData(o, w, h), 0, 0); return cv;

    if (!next) { h.targets = L.items.filter(it => !has(S.searched, it.spot)); h.timer = 1.2; return; }
    const adj = (x, y) => Math.abs(x - next.x) + Math.abs(y - next.y) === 1;
    if (adj(h.p.x, h.p.y)) { h.cur = next; h.timer = 2.2; return; }

  }

  /* ---------- 주인공 이동 ---------- */
  function ensureMe() {
    ensurePos();
    if (room !== S.room) { room = S.room; me.fx = S.pos.x; me.fy = S.pos.y; me.seg = null; me.path = null; me.after = null; makeNpcs(); bgKey = ""; }
  }
  function tryStep(dx, dy) {
    const L = layout(S.room), x = S.pos.x + dx, y = S.pos.y + dy;
    me.dir = dirOf(dx, dy);

    if (d) { goDoor(d); return; }
    if (walkable(L, x, y)) { me.seg = [x, y]; S.pos = { room: S.room, x, y }; }
  }
  function goDoor(d) {
    if (S.locks[d.to]) { toast(`${esc(C().rooms[d.to].name)}은(는) 잠겨 있다. ${S.locks[d.to]}턴 뒤에 열린다.`, true); Sound.wrong(); me.path = null; return; }
    const from = S.room; S.room = d.to;

    const path = findPath(L, S.pos, goals);

  }
  function go(t) {

    if (t.kind === "door") { walkTo([[t.ref.x, t.ref.y]]); return; }
    if (t.kind === "floor") { if (walkable(L, t.x, t.y) && !doorAt(L, t.x, t.y)) walkTo([[t.x, t.y]]); return; }
    if (t.kind === "person") { const n = npcs.find(x => x.p === t.ref); if (n) { n.hold = 8; n.path = null; } }
    const goals = NB.map(([dx, dy]) => [t.ref.x + dx, t.ref.y + dy]).filter(([x, y]) => walkable(L, x, y) && !doorAt(L, x, y));

  }

      const x = S.pos.x + dx, y = S.pos.y + dy;
      const it = L.items.find(o => o.x === x && o.y === y); if (it) return { kind: "obj", ref: it };
      const p = L.people.find(o => o.x === x && o.y === y); if (p) return { kind: "person", ref: p };

  }
  function describe(t) {

    if (t.kind === "person") return t.ref.kind === "h" ? `${t.ref.name} — 조사 중` : `${t.ref.name} — ‘조사’ 또는 스페이스: 대화`;
    if (has(S.searched, t.ref.spot)) return `${t.ref.label} — 이미 조사했다.`;
    return `${t.ref.label} — ‘조사’ 또는 스페이스 (−${has(S.tampered, t.ref.spot) ? 2 : 1}턴)`;
  }

  /* ---------- 그리기 ---------- */
  function drawSprite(sp, dir, frameT, fx, fy, dy = 0) {
    const seq = [0, 1, 0, 2], f = frameT ? seq[Math.floor(frameT) % 4] : 0;
    g.drawImage(sp[dir][f], Math.round(fx * TS), Math.round(fy * TS + TS - 20 + dy));
  }
  function draw(t) {
    const L = layout(S.room);
    const key = [S.room, C().title, JSON.stringify(S.locks), S.fakeSeed].join("|");
    if (key !== bgKey || !bg) { bgKey = key; buildBg(); }
    g.drawImage(bg, 0, 0);
    /* 가구 */
    for (const it of L.items) {
      const f = furnPixel(it.type); if (!f.ready) continue;
      const done = has(S.searched, it.spot);
      g.globalAlpha = done ? .65 : 1; g.drawImage(f.cv, it.x * TS, it.y * TS); g.globalAlpha = 1;
    }
    for (const d of L.deco) { const f = furnPixel(d.type); if (f.ready) g.drawImage(f.cv, d.x * TS, d.y * TS); }
    /* 인물: 위에서부터 차례로 */
    const ents = [];
    for (const n of npcs) ents.push({ y: n.fy, draw: () => drawSprite(charSprites(n.p.name, n.p.role), n.dir, n.frameT, n.fx, n.fy) });
    for (const h of Object.values(helpers)) if (h.room === S.room) {
      const rummage = h.cur && h.timer > 0 ? (Math.floor(t / 180) % 2) : 0;
      ents.push({ y: h.fy, draw: () => drawSprite(charSprites(h.p.name, h.p.role), h.dir, h.frameT || rummage * 1, h.fx, h.fy, rummage) });
    }
    ents.push({ y: me.fy, draw: () => drawSprite(charSprites(pname(), "", true), me.dir, me.frameT, me.fx, me.fy) });
    ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());
    /* 손전등 같은 조명 */
    const lx = (me.fx + .5) * TS, ly = (me.fy + .5) * TS, grd = g.createRadialGradient(lx, ly, 10, lx, ly, 120);
    grd.addColorStop(0, "rgba(255,220,160,0.06)"); grd.addColorStop(.35, "rgba(6,9,13,0.12)"); grd.addColorStop(1, "rgba(6,9,13,0.5)");

    for (const it of L.items) {
      const done = has(S.searched, it.spot), tam = has(S.tampered, it.spot), X = it.x * TS + 8, bob = done ? 0 : Math.round(Math.sin(t / 260 + it.x) * 1.5), Y = it.y * TS - 5 + bob;
      const col = done ? "#7fb59a" : tam ? "#d06a5c" : "#e2b25c";
      g.fillStyle = "#16110f"; g.fillRect(X - 4, Y - 4, 9, 9); g.fillStyle = col; g.fillRect(X - 3, Y - 3, 7, 7); g.fillRect(X, Y + 4, 1, 2);
      g.fillStyle = done ? "#0f1a12" : tam ? "#fff" : "#1a1408";
      if (done) { g.fillRect(X - 2, Y, 1, 1); g.fillRect(X - 1, Y + 1, 1, 1); g.fillRect(X, Y, 1, 1); g.fillRect(X + 1, Y - 1, 1, 1); g.fillRect(X + 2, Y - 2, 1, 1); }
      else if (tam) { g.fillRect(X, Y - 2, 1, 3); g.fillRect(X, Y + 2, 1, 1); }
      else { g.fillRect(X - 1, Y - 2, 3, 1); g.fillRect(X + 1, Y - 1, 1, 1); g.fillRect(X, Y, 1, 1); g.fillRect(X, Y + 2, 1, 1); }
    }
  }
  /* 이름표·말풍선·문 이름(글자는 화면 위에 얹는다) */
  function placeLabels() {
    if (!labels) return;
    const L = layout(S.room), list = [];
    for (const n of npcs) list.push([n.p.id, n.fx + .5, n.fy - .2, `${n.p.name}${S.silence[n.p.id] ? " · 침묵" : ""}`, "nm" + (S.silence[n.p.id] ? " silent" : "")]);
    for (const h of Object.values(helpers)) if (h.room === S.room) list.push(["h" + h.pid, h.fx + .5, h.fy - .2, `${h.p.name} · ${h.state === "out" ? "보고 완료!" : "조사 중…"}`, "nm ally" + (h.state === "out" ? " done" : "")]);
    for (const d of L.doors) list.push(["d" + d.x + d.y, d.side === "b" ? d.x + .5 : .9, d.side === "b" ? EXH - .35 : d.y + .55, d.stairs ? `계단 ${d.stairs}` : C().rooms[d.to].name, "door" + (S.locks[d.to] ? " locked" : "") + (d.side === "l" ? " left" : "")]);
    const seen = new Set();
    for (const [id, x, y, text, cls] of list) {
      seen.add(id);
      let el = labels.querySelector(`[data-l="${id}"]`);
      if (!el) { el = document.createElement("span"); el.dataset.l = id; labels.appendChild(el); }
      if (el.textContent !== text) el.textContent = text;
      if (el.className !== "pxl " + cls) el.className = "pxl " + cls;
      el.style.left = (x / EXW * 100) + "%"; el.style.top = (y / EXH * 100) + "%";

  }

  /* ---------- 반복 ---------- */
  let heldDir = null;
  function loop(t) {
    raf = requestAnimationFrame(loop);
    if (!cv || !document.body.contains(cv)) { cancelAnimationFrame(raf); raf = 0; return; }
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    ensureMe();
    /* 키·버튼으로 걷기 */
    const kd = keys.up ? [0, -1] : keys.down ? [0, 1] : keys.left ? [-1, 0] : keys.right ? [1, 0] : null;
    if (!me.seg) {
      if (me.path && me.path.length) {
        const [nx, ny] = me.path[0], L = layout(S.room), d = doorAt(L, nx, ny);
        if (d) { me.path = null; goDoor(d); return; }
        if (!walkable(L, nx, ny)) { const after = me.after, goals = [me.path[me.path.length - 1]]; me.path = null; setTimeout(() => walkTo(goals, after), 300); }
        else { me.path.shift(); me.dir = dirOf(nx - S.pos.x, ny - S.pos.y); me.seg = [nx, ny]; S.pos = { room: S.room, x: nx, y: ny }; }
      } else if (me.path && !me.path.length) { const after = me.after; me.path = null; me.after = null; if (after) after(); }

    } else if (!kd) me.frameT = 0;

  function tileFromEvent(e) {

    hold(dir, down) {

        Sound.init(); me.path = null;
        if (!me.seg && S.turns > 0 && room === S.room) { const v = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[dir]; tryStep(v[0], v[1]); }

    interact() { act(nearby()); },
    clearKeys() { for (const k in keys) keys[k] = false; },
    helperEnter,
    prune() { for (const h of Object.values(helpers)) if (!missionAlive(h) && !(S.room === h.room && S.tab === "rooms" && cv && document.body.contains(cv))) dropHelper(h); },
    go, act,
    debug() { return { me: { x: S.pos && S.pos.x, y: S.pos && S.pos.y, fx: +me.fx.toFixed(2), fy: +me.fy.toFixed(2), dir: me.dir, walking: !!(me.seg || (me.path && me.path.length)) },

})();

function renderPixel(out) {
  ensurePos();

  const floorOf = c.floors.find(f => f.rooms.includes(rid));
  const found = allSpots(rid).filter(sp => has(S.searched, sp.id)), left = allSpots(rid).length - found.length;
  const results = found.map(sp => `<div class="spot"><b>${esc(sp.label)}</b><p class="result">${esc(sp.text)}</p>
    ${sp.fake ? `<span class="found-chip fake">헛수고 · 사건과 관계없음</span>` : ""}${sp.clue ? `<span class="found-chip">단서 · ${esc(c.clues[sp.clue].name)}</span><p class="result">${esc(c.clues[sp.clue].text)}</p>` : ""}</div>`).join("");
  const roomNav = c.floors.map(f => `<div class="nav-floor"><span class="label">${f.label}</span><div class="nav-rooms">${f.rooms.map(id => roomBtn(id)).join("")}</div></div>`).join("");
  return `<div class="playfield" aria-live="polite">
    ${decisionBanner()}
    <div class="room-bar"><span class="label">${floorOf ? floorOf.label : ""}</span><b>${r.name}</b>
      <span class="hint">${left ? `조사하지 않은 곳(?) ${left}곳` : "모두 조사했다"}</span></div>
    <div class="pxview" id="pxview">${lk ? `<div class="map-lock">잠김 · ${lk}턴</div>` : ""}</div>

        <button class="pad up" data-pad="up" aria-label="위">▲</button><button class="pad left" data-pad="left" aria-label="왼쪽">◀</button>
        <button class="pad right" data-pad="right" aria-label="오른쪽">▶</button><button class="pad down" data-pad="down" aria-label="아래">▼</button>
      </div>

  </div>`;
}

function renderGong() {
  if (!gongOn() || !allSpots(S.room).some(sp => !has(S.searched, sp.id))) return "";
  const can = clearLeft() > 0 && S.turns > 0 && !S.locks[S.room];
  return `<div class="dispatch">
    <b>강력계 순경 공태하</b>
    <p class="hint">강무열 경감과 다니며 사건과 상관없어 보이는 물건을 치워요. 가짜 물건이 사라지고, 턴은 안 줄어요.</p>
    <div class="q-actions"><button class="act ally with-face" data-clearfakes="1" ${can ? "" : "disabled"}>${pixelFace("공태하", 24)}이 방 쓸데없는 물건 치우기<span class="cost">${clearLeft() > 0 ? `${clearLeft()}번 남음` : "끝"}</span></button></div>
  </div>`;
}
function pressBtn(sid) {
  if (!gongOn()) return "";
  const n = (S.press || {})[sid] || 0, risk = PRESS_RISK[Math.min(n + 1, 3)];
  const lv = risk < .3 ? "조금 위험" : risk < .7 ? "위험 — 역효과 날 수 있음" : "매우 위험 — 거의 역효과";
  return `<button class="choice press with-face" data-press="${sid}"><span class="ck">압박</span><span>${pixelFace("공태하", 22)} 공태하 순경이 겁을 준다${n ? ` <small class="hint">(${n}번 압박함)</small>` : ""}</span><span class="cost">−1턴 · ${lv}</span></button>`;
}
function renderDispatch(r) {
  const rule = DISPATCH[S.diff];
  if (!rule) return "";
  const left = allSpots(S.room).some(sp => !has(S.searched, sp.id));
  const busy = S.missions.find(m => m.room === S.room);
  if (!left && !busy) return "";
  const btns = PARTNERS.filter(x => !x.noDispatch && rule.max[x.id]).map(x => {
    const left = dispatchLeft(x.id), away = S.missions.some(m => m.pid === x.id);
    const tag = away ? "출동 중" : left <= 0 ? "끝" : `${left}번 남음`;
    return `<button class="act ally with-face" data-dispatch="${x.id}" ${canDispatch(x.id) ? "" : "disabled"}>
      ${pixelFace(x.name, 24)}${x.title} ${x.name}<span class="cost">${tag}</span></button>`;
  }).join("");
  return `<div class="dispatch">
    <b>팀원 출동</b>
    <p class="hint">${busy ? `${I(partner(busy.pid).name)} 여기를 조사하는 중이에요. ${busy.due - S.actions}턴 뒤에 보고해요.`
      : `팀원을 보내면 문으로 들어와 이 장소를 대신 조사하고 ${MISSION_DELAY}턴 뒤에 보고해요. 턴은 안 줄어요. 잠긴 방도 들어가요.`}</p>
    <div class="q-actions">${btns}</div>
  </div>`;
}

/* ---------- 대답 판단: 주인공·모은재는 모은 증거만큼 정확, 한서진은 바로 간파 ---------- */
const READ_WHO = { me: "내 판단", psy: "모은재", prof: "한서진" };
const SURE = ["판단 불가", "근거 약함", "근거 보통", "확실"];
function evidenceCover() { return Math.min(1, S.found.length / Math.max(1, Object.keys(C().clues).length)); }
function readOf(q, who) {
  if (who === "prof") return q.lie
    ? { v: "lie", sure: 3, text: "“거짓말입니다. 말과 눈빛이 따로 놀아요.”" }
    : { v: "true", sure: 3, text: "“사실입니다. 거짓말하는 얼굴이 아니에요.”" };
  const c = C(), cov = evidenceCover(), psy = who === "psy";
  const hit = q.lie && q.lie.clues.find(k => has(S.found, k));
  if (hit) return psy ? { v: "lie", sure: 3, text: `“‘${c.clues[hit].name}’ 단서랑 어긋나요. 거짓말이에요.”` }
    : { v: "lie", sure: 2, text: "모은 증거 중에 이 말과 어긋나는 게 있다. 거짓말 같다." };
  if (cov < (psy ? .1 : .15)) return { v: "unsure", sure: 0, text: psy ? "“아직 증거가 너무 없어요. 판단이 안 서요.”" : "증거가 부족해 아직 판단이 안 선다." };
  const acc = Math.min(.92, (psy ? .55 : .5) + (psy ? .4 : .35) * cov + (S.diff === "easy" ? .1 : 0));
  const r = (hashStr([q.id, who, S.found.length, S.fakeSeed].join("|")) % 1000) / 1000;
  const truth = q.lie ? "lie" : "true", v = r < acc ? truth : truth === "lie" ? "true" : "lie", sure = cov >= .45 ? 2 : 1;
  const T = psy
    ? { lie: ["“말끝이 흐려져요… 거짓말일 수도 있어요.”", "“증거랑 조금 안 맞아요. 거짓말 같아요.”"], true: ["“음… 사실 같기도 해요.”", "“증거랑 맞아요. 사실인 것 같아요.”"] }
    : { lie: ["왠지 걸린다… 거짓말일지도.", "증거와 잘 안 맞는다. 거짓말 같다."], true: ["일단은 말이 되는 것 같다.", "지금까지 모은 증거와 맞아떨어진다. 사실 같다."] };
  return { v, sure, text: T[v][sure - 1] };
}
function readTags(q) {
  if (has(S.broken, q.id)) return "";
  const r = (S.reads || {})[q.id] || {};
  const one = (who, x) => `<span class="read ${x.v} s${x.sure}"><b>${READ_WHO[who]}</b><span>${esc(x.text)}</span><i>${SURE[x.sure]}</i></span>`;
  return `<span class="reads">${one("me", readOf(q, "me"))}${r.psy ? one("psy", r.psy) : ""}${r.prof ? one("prof", r.prof) : ""}</span>`;
}
function readBtns(q, sid) {
  if (has(S.broken, q.id) || S.silence[sid] || S.turns <= 0 || S.decided) return "";
  const r = (S.reads || {})[q.id] || {};
  const btns = REBUTTERS.filter(x => !r[x.id] && rebutLeft(x.id) > 0).map(x => `<button class="act ally with-face" data-read="${x.id}" data-q="${q.id}">${pixelFace(x.name, 22)}${x.name}: ${x.id === "prof" ? "거짓말 간파" : "증거로 분석"}<span class="cost">${x.id === "prof" ? "바로 앎" : "증거만큼 정확"} · ${rebutLeft(x.id)}번</span></button>`).join("");
  return btns ? `<div class="q-actions advice-btns">${btns}</div>` : "";
}
function doRead(rid, qid) {
  const f = findQ(qid); if (!f) return;
  const { q, p, sid } = f, x = REBUTTERS.find(r => r.id === rid);
  S.reads = S.reads || {};
  if (!x || rebutLeft(rid) <= 0 || S.turns <= 0 || S.silence[sid] || !has(S.asked, qid) || has(S.broken, qid)) return;
  const R = S.reads[qid] = S.reads[qid] || {};
  if (R[rid]) return;
  R[rid] = readOf(q, rid); S.rebuts.push(rid);
  S.lastLine = { sid, who: `${x.title} ${x.name}`, kind: "answer", qid,
    q: rid === "prof" ? `(${p.name} 씨를 빤히 바라본다) “‘${q.q}’ — 방금 그 말, 한 번만 더 해 보시죠.”` : `“${p.name} 씨, ‘${q.q}’ 다시 여쭤봐도 될까요?”`, a: q.a };
  toast(`<b>${esc(x.title + " " + x.name)}</b> — ${esc(R[rid].text)}`); Sound.help();
}

/* ---------- 대화(심문) 화면 ---------- */
function renderPeople(out) {
  const c = C();
  const heartLabel = sid => S.heart[sid] === "open" ? `<span class="heart open">♥ 마음 열림</span>` : S.heart[sid] === "closed" ? `<span class="heart closed">♡ 닫힘</span>` : "";
  const list = Object.entries(c.suspects).map(([id, p]) => {
    const open = p.qs.filter(q => qOpen(q));
    const left = open.filter(q => !has(S.asked, q.id)).length;

  /* 말풍선: 마지막 대화 */

    : `<div class="line them"><span class="who-tag">${esc(p.name)}</span><p>“…무슨 일이시죠, 형사님?”</p></div>`;
  /* 선택지 */
  let choices = "";
  const D = S.dlg;
  const statements = p.qs.filter(q => has(S.asked, q.id) && !has(S.broken, q.id));
  if (out) choices = `<p class="locked">결단의 시간이다. 더 물어볼 수 없다.</p>`;
  else if (sl) choices = `<p class="locked-room">“더는 아무 말도 안 하겠어요.” ${sl}턴 동안 대화할 수 없다.</p>`
    + ((S.counter || {})[sid]
      ? `<p class="locked">한서진의 반격도 통하지 않았다. 입이 풀릴 때까지 기다려야 한다.</p>`
      : pressBtn(sid) + `<button class="choice press with-face" data-counter="${sid}"><span class="ck">반격</span><span>${pixelFace("한서진", 22)} 한서진 경위가 대신 나서서 반격한다<br><small class="hint">${counterLie(sid) ? "찌를 증거가 있다. 잘 통할 것 같다." : "찌를 증거가 없다. 통할지 모르겠다."}</small></span><span class="cost">실패하면 −${COUNTER_SEC}초 · −${COUNTER_TURNS}턴</span></button>`);
  else if (!D) {
    const avail = p.qs.filter(q => qOpen(q) && !has(S.asked, q.id));
    const locked = p.qs.filter(q => !qOpen(q)).length;
    choices = avail.map(q => `<button class="choice" data-ask="${q.id}"><span class="ck">질문</span><span>“${esc(q.q)}”</span><span class="cost">−1턴</span></button>`).join("")
      + (statements.length && S.found.length ? `<button class="choice press" data-dlg="contradict"><span class="ck">추리</span><span>모순을 지적한다</span><span class="cost">틀리면 −10초</span></button>` : "")
      + (p.qs.some(q => has(S.asked, q.id)) ? pressBtn(sid) : "")
      + (!S.heart[sid] && p.qs.some(q => has(S.asked, q.id)) ? `<button class="choice heart" data-dlg="heart"><span class="ck">호감</span><span>마음을 열게 한다</span><span class="cost">한 번뿐 · −1턴</span></button>` : "")

      + `<button class="choice back" data-dlg="back"><span>그만둔다</span></button>`;

    const broken = has(S.broken, q.id);

  }).join("") + S.secrets.filter(x => x.sid === sid).map(x => `<div class="logq"><span class="verdict-tag ally">숨은 증언</span><p class="answer rebut">${esc(x.text)}</p></div>`).join("");
  return `<div class="split">
    <div class="people">${list}${side}</div>

      <div class="speech">${speech}</div>

      ${log ? `<details class="talklog"><summary>지난 대화 (${p.qs.filter(q => has(S.asked, q.id)).length})</summary>${log}</details>` : ""}

}

        <p class="hint">수첩의 ‘방해와 도움’에 적힌 흔적과 이 사람의 모습을 비교해 보자.</p>` : ""}

}

    <section class="panel"><h3>단서 <span class="mono" style="color:var(--muted);font-size:14px">${S.found.length}/${Object.keys(c.clues).length}</span></h3><div class="clue-list">${clues}</div></section>

function renderAccuse() {

    <p class="hint">지목 기회: <b>${S.chances}번</b>${S.chances > 1 ? " · 틀려도 한 번 더 고를 수 있다(−10초)" : " · 틀리면 게임 오버"}</p>
    <fieldset><legend>범인은 누구인가</legend>${radio("culprit", suspects, pk.culprit)}</fieldset>
    <fieldset><legend>동기</legend>${radio("motive", c.motives, pk.motive)}</fieldset>
    <fieldset><legend>수법</legend>${radio("method", c.methods, pk.method)}</fieldset>
    <fieldset><legend>결정적 증거 (최대 3개)</legend>${ev}</fieldset>

function judge() {
  const c = C(), pk = S.pick, A = c.answer;
  const ok = { c: pk.culprit === A.culprit, m: pk.motive === A.motive, w: pk.method === A.method };
  if (!ok.c) {
    S.chances -= 1; S.wrongAccuse += 1;
    if (S.chances > 0) {   /* 어려움: 한 번 더 */
      const wrongId = pk.culprit;
      S.cleared.push(wrongId); S.pick.culprit = "";
      toast(`<b>틀렸다!</b> ${esc(EUN(c.suspects[wrongId].name))} 범인이 아니다. 남은 지목 기회 ${S.chances}번.`, true); Sound.wrong();
      if (S.turns > 0) penalty("범인을 잘못 지목했다");
      return;
    }
    S.screen = "gameover"; saveRecord(c.id, "F"); Sound.verdict(false);
    return;
  }
  const evGood = pk.evidence.filter(e => c.key.includes(e)).length;
  let score = 40 + (ok.m ? 15 : 0) + (ok.w ? 15 : 0) + Math.min(evGood, 3) * 5 + Math.min(S.broken.length, 3) * 3 + Math.min(S.turns, 6) - S.wrong * 2
    + DIFF[S.diff].bonus + (S.timeLeft > 0 ? 5 : 0) + (S.accCaught ? 4 : 0) + Math.min(S.secrets.length, 2) * 2 - S.wrongAccuse * 10;
  score = Math.max(0, Math.min(100, score));
  const grade = score >= 92 ? "S" : score >= 78 ? "A" : score >= 62 ? "B" : "C";
  S.result = { ...ok, evGood, score, grade };
  S.screen = "result";
  saveRecord(c.id, grade);
  Sound.verdict(true);
}

function renderGameOver() {
  const c = C(), pk = S.pick;
  app.innerHTML = `<section class="verdict gameover">

    <div class="intro-scene end-scene">
      <div class="pxview" id="end-view" aria-label="범인을 놓친 뒤 강력팀이 서로를 위로하는 장면"><span class="intro-sign">강력팀</span></div>
      <div class="intro-cap narr" id="end-cap" aria-live="polite"><p>…</p></div>
    </div>
    <div class="grade fail">GAME OVER</div>
    <h2>범인을 놓쳤다.</h2>
    <p class="lede">${pk.culprit ? `${esc(EUN(c.suspects[pk.culprit].name))} 범인이 아니었다. ` : ""}진짜 범인은 혼란을 틈타 사라졌고, 사건은 미제로 남았다.</p>
    <div class="btn-row">
      ${c.random ? `<button class="btn" data-random="1">새 무작위 사건</button>` : `<button class="btn" data-case="${c.id}">다시 출동한다</button>`}
      <button class="btn ghost" data-act="files">사건 목록</button>
    </div>
    <details class="spoiler"><summary>그래도 진상이 궁금하다면 (스포일러)</summary>
      <div class="truth">${c.truth.map(t => `<p>${esc(t)}</p>`).join("")}</div>
    </details>
  </section>`;
  ENDING.mount(document.getElementById("end-view"), "lose");
}

function renderResult() {
  const c = C(), R = S.result, pk = S.pick, real = c.suspects[c.answer.culprit].name;
  const row = (label, ok, val) => `<div class="score-row"><span>${label}</span><span class="${ok ? "ok" : "no"}">${val}</span></div>`;
  const headline = R.grade === "S" ? `완벽한 추리. ${EUN(real)} 더 이상 변명하지 못했다.`
    : R.grade === "A" ? "범인을 잡았다. 법정에서도 충분히 버틸 추리다."
    : "범인은 잡았지만, 변호사가 빈틈을 파고들 것이다.";
  const next = c.random ? null : caseById(nextCaseId());
  app.innerHTML = `<section class="verdict">
    <span class="label">${esc(pname())} ${PLAYER_RANK} · ${c.title} · 수사 결과</span>
    <div class="intro-scene end-scene">
      <div class="pxview" id="end-view" aria-label="범인을 체포하고 강력팀이 축하하는 장면"><span class="intro-sign">강력팀</span></div>
      <div class="intro-cap narr" id="end-cap" aria-live="polite"><p>…</p></div>
    </div>
    <div class="grade">${R.grade}</div>
    <h2>${headline}</h2>
    <div class="score-rows">
      ${row("범인", true, real)}
      ${row("동기", R.m, R.m ? "정답" : "오답")}
      ${row("수법", R.w, R.w ? "정답" : "오답")}
      ${row("결정적 증거", R.evGood > 0, `${R.evGood} / ${Math.max(pk.evidence.length, 1)} 유효`)}
      ${row("무너뜨린 거짓말", S.broken.length > 0, `${S.broken.length}개`)}
      ${row("숨은 증언", S.secrets.length > 0, `${S.secrets.length}개`)}
      ${row("틀린 추리", S.penalties === 0, `${S.penalties}회 (−${S.penalties * PENALTY_SEC}초)`)}
      ${S.wrongAccuse ? row("잘못된 지목", false, `${S.wrongAccuse}회`) : ""}
      ${S.vars.length ? row("공범 체포", S.accCaught, S.accCaught ? `성공 (+4) · ${accomplice().name}` : `못 잡음 · 공범은 ${accomplice().name}(${accomplice().role})`) : ""}
      ${row("팀의 도움", true, `${S.helps + S.dispatched.length + S.rebuts.length}회`)}
      ${row("남은 시간", S.timeLeft > 0, S.turns > 0 ? `${mmss(S.timeLeft)} · ${S.turns}턴` : "결단의 시간에 지목")}
      ${row("난이도", true, `${DIFF[S.diff].label}${DIFF[S.diff].bonus ? ` (+${DIFF[S.diff].bonus})` : ""}`)}
      <div class="score-row"><b>점수</b><b class="mono">${R.score}</b></div>
    </div>
    <div class="person-head culprit"><span class="portrait">${pixelFace(real, 96, c.suspects[c.answer.culprit].role)}</span><div><span class="label">진범</span><h3 style="font-size:24px">${real}</h3><span class="hint">${c.suspects[c.answer.culprit].role}</span></div></div>
    <h3>사건의 진상</h3>
    <div class="truth">${c.truth.map(t => `<p>${esc(t)}</p>`).join("")}</div>
    <div class="btn-row">
      ${c.random
        ? `<button class="btn" data-random="1">새 무작위 사건</button>`
        : `<button class="btn" data-case="${next.id}">다음 사건: ${next.title}</button><button class="btn ghost" data-random="1">무작위 사건</button>`}
      <button class="btn ghost" data-act="files">사건 목록</button>
      ${c.random ? "" : `<button class="btn ghost" data-case="${c.id}">이 사건 다시 하기</button>`}
    </div>
  </section>`;
  ENDING.mount(document.getElementById("end-view"), "win");
}

/* ===================== 이벤트 ===================== */
const inGameRooms = () => S.screen === "game" && S.tab === "rooms";
document.addEventListener("keyup", e => { if (inGameRooms()) PX.key(e, false); });
addEventListener("blur", () => PX.clearKeys());
document.addEventListener("keydown", e => {
  if (!inGameRooms()) return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (/INPUT|SELECT|TEXTAREA/.test(tag)) return;
  if (/BUTTON/.test(tag) && /^( |enter)$/i.test(e.key)) return;   /* 버튼에 초점이 있으면 그 버튼을 누르게 둔다 */
  PX.key(e, true);
});
/* 방향 버튼: 누르고 있으면 계속 걷는다 */
app.addEventListener("pointerdown", e => { const b = e.target.closest("[data-pad]"); if (!b) return; e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); PX.hold(b.dataset.pad, true); });
for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) app.addEventListener(ev, e => { const b = e.target.closest && e.target.closest("[data-pad]"); if (b) PX.hold(b.dataset.pad, false); });
app.addEventListener("keydown", e => { const b = e.target.closest("[data-pad]"); if (b && /^( |enter)$/i.test(e.key)) { e.preventDefault(); PX.hold(b.dataset.pad, true); setTimeout(() => PX.hold(b.dataset.pad, false), 140); } });

function confront(qid, clueId) {
  const f = findQ(qid); if (!f) return;
  const { q, p, sid } = f;
  if (S.turns <= 0 || has(S.broken, q.id) || S.silence[sid]) return;
  S.dlg = null;
  const clueName = C().clues[clueId] ? C().clues[clueId].name : "";
  if (q.lie && q.lie.clues.includes(clueId)) {
    S.broken.push(q.id); addTl(q.lie.tl);
    S.lastLine = { sid, q: `‘${clueName}’을(를) 들이밀었다.`, a: q.lie.reply, kind: "broken" };
    toast(`<b>모순!</b> ${esc(p.name)}의 진술이 무너졌다.`); Sound.lie(); flash();
    spend();
  } else {
    S.wrong += 1;
    S.lastLine = { sid, q: `‘${clueName}’을(를) 들이밀었다.`, a: p.deflect, kind: "deflect" };
    toast(`${esc(EUN(p.name))} 꿈쩍도 하지 않는다.`, true); Sound.wrong();
    spend();
    penalty("틀린 추리였다");
  }
}
app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled || b.dataset.pad) return;
  const d = b.dataset;
  let top = false;
  Sound.init();
  if (d.act === "sound") { Sound.toggle(); }
  else if (d.act === "enter") { savePlayer(); S.screen = "files"; top = true; Sound.thunder(); flash(); }
  else if (d.act === "title") { S = fresh(); top = true; }
  else if (d.random) { openRandom(); top = true; }
  else if (d.case) { openCase(d.case); top = true; }
  else if (d.pg) { PLAYER_G = d.pg; try { localStorage.setItem("midnight-player-g", PLAYER_G); } catch {} const pv = document.getElementById("me-preview"); if (pv) pv.innerHTML = mePreview(); return; }
  else if (d.act === "skip-intro") { INTRO.finish(); return; }
  else if (d.act === "replay-intro") { S.introDone = false; INTRO.reset(); top = true; }
  else if (d.act === "start") { beginCase(); top = true; Sound.thunder(); flash(); }
  else if (d.act === "files") { S = Object.assign(fresh(), { screen: "files" }); top = true; }
  else if (d.act === "wait") { if (S.turns <= 0) return; Sound.step(); spend(); }
  else if (d.tab) { S.tab = d.tab; S.dlg = null; }
  else if (d.room) { S.room = d.room; }
  else if (d.dispatch) { dispatch(d.dispatch); }
  else if (d.vtalk) { talkVar(+d.vtalk); }
  else if (d.vaccuse) { accuseVar(+d.vaccuse); }
  else if (d.suspect) { S.suspect = d.suspect; S.dlg = null; }
  else if (d.search) { if (!doSearch(d.search)) return; }
  else if (d.act === "interact-px") { PX.interact(); return; }
  else if (d.ask) {
    const { q, sid } = findQ(d.ask);
    if (S.turns <= 0 || has(S.asked, q.id) || S.silence[sid]) return;
    Sound.ask(); S.asked.push(q.id); addTl(q.tl, q.lie ? q.id : null);
    S.lastLine = { sid, q: q.q, a: q.a, kind: "answer", qid: q.id }; S.dlg = null;
    spend();
  }
  else if (d.dlg === "contradict") { S.dlg = { step: "statement" }; }
  else if (d.dlg === "heart") { S.dlg = { step: "heart" }; }
  else if (d.dlg === "back") { S.dlg = null; }
  else if (d.stmt) { S.dlg = { step: "clue", q: d.stmt }; }
  else if (d.confront) { confront(S.dlg && S.dlg.q, d.confront); }
  else if (d.tone) { openHeart(S.suspect, d.tone); }
  else if (d.read) { doRead(d.read, d.q); }
  else if (d.counter) { counterattack(d.counter); }
  else if (d.press) { pressure(d.press); }
  else if (d.clearfakes) { clearFakes(); }
  else return;
  render();
  if (top) window.scrollTo(0, 0);
});
function savePlayer() {
  const el = document.getElementById("player-name");
  if (el) PLAYER = el.value.trim().slice(0, 12);
  try { localStorage.setItem("midnight-player", PLAYER); } catch {}
}
app.addEventListener("input", e => {
  if (e.target.id !== "player-name") return;
  PLAYER = e.target.value.slice(0, 12);
  const pv = document.getElementById("me-preview"); if (pv) pv.innerHTML = mePreview();
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "present") { S.present = t.value; return; }
  if (t.name === "diff") { S.diff = t.value; render(); return; }
  if (t.name === "timed") { S.timed = t.checked; render(); return; }
  if (t.name === "evidence") S.pick.evidence = [...app.querySelectorAll('input[name="evidence"]:checked')].map(i => i.value);
  else if (["culprit", "motive", "method"].includes(t.name)) S.pick[t.name] = t.value;
  else return;
  render();
});
app.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "name-form") { Sound.init(); savePlayer(); S.screen = "files"; render(); Sound.thunder(); flash(); return; }
  const pk = S.pick; if (!(pk.culprit && pk.motive && pk.method)) return;
  judge(); render(); window.scrollTo(0, 0);
});

/* ===================== 비 효과 ===================== */
(function rain() {
  const cv = document.getElementById("rain"), ctx = cv.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let W, H, drops;
  const size = () => {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    drops = Array.from({ length: Math.round(W * H / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * H, l: 8 + Math.random() * 14, v: 6 + Math.random() * 6 }));
  };
  size(); addEventListener("resize", size);
  const color = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim() || "#8395a2";
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.beginPath();
    for (const d of drops) {
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 2, d.y + d.l);
      d.y += d.v; d.x -= 0.6;
      if (d.y > H) { d.y = -d.l; d.x = Math.random() * W; }
    }
    ctx.stroke(); requestAnimationFrame(tick);
  })();
})();

/* 페이지 업데이트 시 진행 상태 유지 */
window.claude?.hot?.snapshot?.(() => S);
const start = data => { if (data && data.screen && (["title", "files"].includes(data.screen) || caseById(data.caseId) || data.randomCase)) S = Object.assign(fresh(), data); render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
