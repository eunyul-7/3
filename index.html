<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한밤의 사건 파일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 수사 수첩 — 상단 상황판(남은 턴), 탭 네비, 본문은 현장 평면도 + 조사 패널 */
:root {
  --bg: #11171c;
  --surface: #19222a;
  --surface-2: #212c35;
  --line: #2f3d48;
  --ink: #dbe3e8;
  --muted: #8395a2;
  --lamp: #e2b25c;
  --lamp-dim: #6b5530;
  --blood: #d06a5c;
  --ok: #7fb59a;
  --f-display: "Gowun Batang", "Nanum Myeongjo", "Batang", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; position: relative; z-index: 1; }
body.playing .wrap { max-width: 1280px; gap: 12px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 46px); letter-spacing: -0.01em; }
h2 { font-size: 24px; }
h3 { font-size: 18px; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

#rain { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .35; }
#rotate { display: none; position: fixed; inset: 0; z-index: 9999; background: #07090d; color: #f1ece2; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
#rotate > b { font-size: 22px; color: var(--lamp); } #rotate p { margin: 0; color: var(--muted); line-height: 1.6; } #rotate p b { color: #f1ece2; }
.rot-phone { width: 56px; height: 96px; border: 4px solid #f1ece2; border-radius: 12px; position: relative; animation: rot-turn 2.2s ease-in-out infinite; }
.rot-phone i { position: absolute; left: 50%; bottom: 6px; width: 10px; height: 4px; margin-left: -5px; border-radius: 2px; background: #f1ece2; }
@keyframes rot-turn { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) and (max-width: 900px) { #rotate { display: flex; } body { overflow: hidden; } }
@media (prefers-reduced-motion: reduce) { #rain { display: none; } }

.btn { background: var(--lamp); color: #1a1408; border: 0; border-radius: 4px; padding: 11px 20px; font-weight: 600; justify-self: start; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--lamp); border: 1px solid var(--lamp-dim); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* 사건 목록 */
.files { display: grid; gap: 22px; padding-block: 24px; }
.files .lede { font-family: var(--f-display); font-size: 18px; max-width: 60ch; }
.file-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.file {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; text-align: left;
  padding: 16px; display: grid; gap: 6px; align-content: start;
}
.file:hover { border-color: var(--lamp-dim); }
.file .no { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.file b { font-family: var(--f-display); font-size: 20px; }
.file .where { color: var(--muted); font-size: 13.5px; }
.stamp { justify-self: start; font-family: var(--f-mono); font-size: 12px; border-radius: 3px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); }
.stamp.solved { border-color: var(--lamp-dim); color: var(--lamp); }
.rules { display: grid; gap: 8px; max-width: 64ch; color: var(--muted); }
.rules b { color: var(--ink); font-weight: 600; }

/* 브리핑 */
.intro { display: grid; gap: 22px; padding-block: 24px; }
.intro .lede { font-family: var(--f-display); font-size: 18px; max-width: 60ch; }
.intro .brief { display: grid; gap: 10px; max-width: 62ch; color: var(--muted); }
.cast { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.cast .person { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 2px; }
.cast .person b { font-family: var(--f-display); font-size: 17px; }
.cast .person span { color: var(--muted); font-size: 13.5px; }

/* 상황판 */
.board { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: grid; gap: 12px; padding-block: 12px; }
.board-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.board-top h2 { font-size: 22px; }
.clock { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pips { display: flex; flex-wrap: wrap; gap: 3px; max-width: 280px; }
.pip { width: 6px; height: 14px; border-radius: 1px; background: var(--lamp); }
.pip.used { background: var(--line); }
.clock .mono { font-size: 13px; color: var(--muted); }
.clock .mono b { color: var(--lamp); font-weight: 500; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 6px 12px; color: var(--muted); font-size: 14px; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--line); background: var(--surface); }
.tab:disabled { opacity: .4; cursor: not-allowed; }
.tab .count { font-family: var(--f-mono); font-size: 11px; color: var(--lamp); margin-left: 4px; }
.tab.quit { margin-left: auto; }

/* 평면도 */
.split { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 20px; }
@media (max-width: 720px) { .split { grid-template-columns: minmax(0, 1fr); } }
.plan { display: grid; gap: 14px; }
.floor { display: grid; gap: 6px; }
.floor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; border: 1px solid var(--line); padding: 4px; border-radius: 3px; }
.room { background: var(--surface); border: 1px solid transparent; border-radius: 2px; padding: 10px; text-align: left; min-height: 64px; display: grid; align-content: space-between; gap: 4px; }
.room:hover { border-color: var(--line); }
.room[aria-pressed="true"] { border-color: var(--lamp); background: var(--surface-2); }
.room .rname { font-family: var(--f-display); font-size: 15px; }
.room .rstat { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.room.crime .rname::after { content: " ✕"; color: var(--blood); }
.room.wide { grid-column: span 2; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.panel .desc { color: var(--muted); max-width: 62ch; }
.spots { display: grid; gap: 10px; }
.spot { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.spot-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.spot-head b { font-weight: 600; }
.act { background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 5px 12px; font-size: 13.5px; }
.act:hover:not(:disabled) { border-color: var(--lamp); color: var(--lamp); }
.act:disabled { opacity: .45; cursor: not-allowed; }
.act.press { border-color: var(--blood); color: var(--blood); }
.act.press:hover:not(:disabled) { border-color: var(--blood); color: var(--ink); background: var(--blood); }
.act .cost { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 6px; }
.result { font-family: var(--f-display); font-size: 15.5px; line-height: 1.75; max-width: 64ch; }
.found-chip.fake { color: var(--muted); border-color: var(--line); }
.found-chip { display: inline-flex; align-items: center; gap: 6px; justify-self: start; font-family: var(--f-mono); font-size: 12px; color: var(--lamp); border: 1px solid var(--lamp-dim); border-radius: 999px; padding: 2px 10px; }

/* 심문 */
.people { display: grid; gap: 6px; }
.who { background: var(--surface); border: 1px solid transparent; border-radius: 3px; text-align: left; padding: 10px 12px; display: grid; gap: 2px; }
.who:hover { border-color: var(--line); }
.who[aria-pressed="true"] { border-color: var(--lamp); }
.who b { font-family: var(--f-display); font-size: 16px; }
.who span { font-size: 13px; color: var(--muted); }
.qa { display: grid; gap: 14px; }
.q { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.q .ask { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.q .ask .text { font-weight: 500; }
.q .tag { font-family: var(--f-mono); font-size: 11px; color: var(--lamp); }
.answer { font-family: var(--f-display); font-size: 15.5px; line-height: 1.75; border-left: 2px solid var(--lamp-dim); padding-left: 12px; max-width: 64ch; }
.answer.retracted { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--blood); }
.answer.broken { border-left-color: var(--blood); }
.answer.deflect { border-left-color: var(--line); color: var(--muted); font-size: 14.5px; }
.verdict-tag { font-family: var(--f-mono); font-size: 11px; color: var(--blood); letter-spacing: .08em; }
.present { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface-2); border: 1px dashed var(--blood); border-radius: 3px; padding: 10px; }
.present label { font-size: 13.5px; color: var(--muted); }
.present select { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px; max-width: 100%; min-width: 0; }
.q-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.locked { color: var(--muted); font-size: 13.5px; }

/* 수첩 */
.notes { display: grid; gap: 20px; margin-top: 20px; }
.clue-list { display: grid; gap: 10px; }
.clue { background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; display: grid; gap: 4px; }
.clue .meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.clue b { font-family: var(--f-display); font-size: 16px; }
.clue p { color: var(--muted); font-size: 14px; }
.timeline { display: grid; border-left: 1px solid var(--line); margin-left: 6px; }
.tl { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 6px 0 6px 14px; position: relative; }
.tl::before { content: ""; position: absolute; left: -4px; top: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--lamp-dim); }
.tl .t { font-family: var(--f-mono); font-size: 13px; color: var(--lamp); }
.tl .src { color: var(--muted); font-size: 12.5px; }
.tl.false .e { text-decoration: line-through; text-decoration-color: var(--blood); color: var(--muted); }
.tl.false::before { background: var(--blood); }
.empty { color: var(--muted); font-style: italic; }

/* 지목 */
.accuse { display: grid; gap: 22px; margin-top: 20px; }
fieldset { border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px 16px; margin: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-family: var(--f-display); font-weight: 700; font-size: 17px; padding: 0 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 6px 4px; border-radius: 3px; cursor: pointer; }
.opt:hover { background: var(--surface-2); }
.opt input { accent-color: var(--lamp); margin-top: 5px; }
.hint { color: var(--muted); font-size: 13.5px; }

/* 결과 */
.verdict { display: grid; gap: 18px; padding-block: 24px; }
.grade { font-family: var(--f-display); font-size: 64px; line-height: 1; color: var(--lamp); }
.grade.fail { color: var(--blood); }
.score-rows { display: grid; gap: 6px; max-width: 520px; }
.score-row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.score-row .ok { color: var(--ok); } .score-row .no { color: var(--blood); }
.truth { display: grid; gap: 12px; max-width: 66ch; font-family: var(--f-display); font-size: 16px; line-height: 1.8; }

/* 타이틀 */
.title { display: grid; gap: 26px; padding-block: 32px 8px; }
.title h1 { font-size: clamp(40px, 10vw, 76px); line-height: 1.05; letter-spacing: -0.02em; }
.title h1 span { color: var(--lamp); }
.title .lede { font-family: var(--f-display); font-size: 18px; max-width: 56ch; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.howto div { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; align-content: start; }
.howto b { font-family: var(--f-display); font-size: 16px; }
.howto b .k { font-family: var(--f-mono); font-size: 11px; color: var(--lamp); margin-right: 6px; letter-spacing: .08em; }
.howto p { color: var(--muted); font-size: 14px; }
.howto .warn b .k { color: var(--blood); }
.sound-btn { background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; color: var(--muted); font-size: 13.5px; }
.sound-btn[aria-pressed="true"] { color: var(--lamp); border-color: var(--lamp-dim); }

/* 훼방 · 긴박 */
.alerts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.alert { font-family: var(--f-mono); font-size: 12px; color: var(--blood); border: 1px solid var(--blood); border-radius: 3px; padding: 2px 8px; }
.urgent .pip:not(.used) { background: var(--blood); }
.urgent .clock .mono b { color: var(--blood); }
@media (prefers-reduced-motion: no-preference) {
  .urgent .clock .mono b { animation: pulse 1s ease-in-out infinite; }
  .urgent .timer b { animation: pulse .5s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 30; background: var(--ink); opacity: 0; }
  #flash.on { animation: flash .9s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 8% { opacity: .35; } 16% { opacity: .05; } 24% { opacity: .25; } 100% { opacity: 0; } }
}
.locked-room { color: var(--blood); font-family: var(--f-display); }
.spot .tampered { font-family: var(--f-mono); font-size: 11px; color: var(--blood); }
.room.is-locked .rstat { color: var(--blood); }
.who.is-silent span.mono { color: var(--blood); }
.event-log { display: grid; gap: 6px; }
.event-log p { color: var(--muted); font-size: 14px; border-left: 2px solid var(--blood); padding-left: 10px; }
.event-log p.good { border-left-color: var(--ok); }
.setup { max-width: 640px; }
.alert.ally { color: var(--ok); border-color: var(--ok); }
.verdict-tag.ally { color: var(--ok); }
.answer.rebut { border-left-color: var(--ok); font-size: 15px; }
.side-label { margin-top: 10px; color: var(--blood); }
.dispatch { border-top: 1px dashed var(--ok); padding-top: 12px; display: grid; gap: 8px; }
.dispatch b { font-weight: 600; color: var(--ok); }
.act.ally:hover:not(:disabled) { border-color: var(--ok); color: var(--ok); }
.setup .opt b { color: var(--ink); }
.timer { color: var(--muted); }
.timer b { color: var(--lamp); font-weight: 500; }
.urgent .timer b { color: var(--blood); }
.diff-chip { font-family: var(--f-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 7px; }
/* 걸어 다니는 지도 */
.view3d { position: relative; border-radius: 6px; overflow: hidden; background: #0b0e12; border: 2px solid #12161a; box-shadow: 0 10px 30px rgba(0,0,0,.45); min-height: 180px; }
.view3d canvas { display: block; width: 100%; touch-action: none; cursor: grab; outline: none; }
.view3d canvas:active { cursor: grabbing; }
.view3d canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--lamp); }
.crosshair { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; border: 2px solid rgba(255,240,210,.8); pointer-events: none; z-index: 2; }
.view3d .map-lock { position: absolute; }
.v3-fail { padding: 30px 16px; color: var(--muted); text-align: center; }
.mode-btns { display: flex; gap: 4px; }
.mode-btns .act.on { border-color: var(--lamp); color: var(--lamp); }
.room-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.map { position: relative; width: 100%; aspect-ratio: 11 / 8; border-radius: 6px; overflow: hidden; outline: none; touch-action: manipulation; cursor: pointer;
  border: 2px solid #12161a; box-shadow: 0 10px 30px rgba(0,0,0,.45); background-color: #3d3027; }
.map.floor-wood { background-color: #4a3727;
  background-image: repeating-linear-gradient(180deg, rgba(0,0,0,.0) 0 calc(100% / 16 - 1px), rgba(0,0,0,.28) calc(100% / 16 - 1px) calc(100% / 16)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 7%, rgba(0,0,0,.05) 7% 14%, rgba(255,255,255,.02) 14% 23%); }
.map.floor-tile { background-color: #5b6066;
  background-image: conic-gradient(#666b71 25%, #50555b 0 50%, #666b71 0 75%, #50555b 0); background-size: calc(100% / 11) calc(100% / 8); }
.map.floor-carpet { background-color: #3a3346;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px), radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.5px);
  background-size: 9px 9px, 13px 13px; background-position: 0 0, 4px 5px; }
.map:focus-visible { box-shadow: 0 0 0 2px var(--lamp), 0 10px 30px rgba(0,0,0,.45); }
.wall { position: absolute; z-index: 1; }
.wall.top { background: linear-gradient(180deg, #232a31 0 55%, #47515b 55% 88%, #2a2219 88% 100%); }
.wall.bottom { background: linear-gradient(180deg, #1c2227, #11161a); }
.wall.side { background: linear-gradient(90deg, #1b2025, #262d34); }
.wall.side.r { background: linear-gradient(270deg, #1b2025, #262d34); }
.wall-deco { position: absolute; z-index: 1; pointer-events: none; }
.wall-deco.frame { background: #6f7f72; border: 3px solid #b48d4c; box-shadow: 0 2px 3px rgba(0,0,0,.5); }
.wall-deco.sconce { border-radius: 50% 50% 4px 4px; background: radial-gradient(circle at 50% 70%, #ffe7a8, #e2b25c 45%, #8a6a2e); box-shadow: 0 0 14px 6px rgba(255,214,140,.35); }
.floor-rug { position: absolute; background: var(--rug); border-radius: 4px; box-shadow: inset 0 0 0 4px rgba(0,0,0,.18), inset 0 0 0 6px rgba(216,180,106,.35), 0 2px 4px rgba(0,0,0,.3); opacity: .85; }
.obj, .npc, .door, .deco, .me { position: absolute; padding: 0; border: 0; background: none; }
.obj { cursor: pointer; }
.obj-art, .deco { display: block; }
.obj-art { width: 100%; height: 100%; transform: scale(1.14); transition: transform .15s; }
.obj svg, .deco svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 2px rgba(0,0,0,.5)); }
.deco svg { transform: scale(1.1); }
.obj:hover .obj-art, .obj:focus-visible .obj-art { transform: scale(1.24); }
.obj:focus-visible { outline: 2px solid var(--lamp); outline-offset: 1px; border-radius: 4px; }
.obj .mark { position: absolute; z-index: 6; left: 50%; top: -34%; transform: translateX(-50%); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  display: grid; place-items: center; font: 700 11px/1 var(--f-mono); background: var(--lamp); color: #1a1408; box-shadow: 0 2px 4px rgba(0,0,0,.5); }
.obj .mark::after { content: ""; position: absolute; left: 50%; bottom: -4px; margin-left: -4px; border: 4px solid transparent; border-bottom: 0; border-top-color: var(--lamp); }
.obj.done .mark { top: -8%; left: auto; right: -6%; transform: none; min-width: 13px; height: 13px; font-size: 9px; background: var(--ok); }
.obj.done .mark::after { display: none; }
.obj.tam .mark { background: var(--blood); color: #fff; }
.obj.tam .mark::after { border-top-color: var(--blood); }
.obj.done .obj-art { opacity: .72; }
.npc { z-index: 2; display: grid; place-items: center; cursor: pointer; }

  const owner = r => Object.entries(c.suspects).find(([, p]) => c.rooms[r].name.includes(p.name));
  const placed = new Set();
  for (const r of rooms) { const o = owner(r); if (o) { out[r].push({ kind: "s", id: o[0], name: o[1].name, role: o[1].role }); placed.add(o[0]); } }

  const pool = free.length ? free : rooms.filter(r => !c.rooms[r].crime);
  let k = 0;
  for (const [sid, p] of Object.entries(c.suspects)) if (!placed.has(sid)) out[pool[k++ % pool.length]].push({ kind: "s", id: sid, name: p.name, role: p.role });

  c.floors.filter(f => f !== fl).forEach((f, i) => out.push({ to: f.rooms[0], x: 0, y: 2 + i * 2, side: "l", stairs: f.label }));
  return out;
}

  const r = C().rooms[rid], h = hashStr(rid + C().title), taken = new Set(), k = (x, y) => x + "," + y;
  const doors = doorsOf(rid);
  doors.forEach(d => taken.add(d.side === "b" ? k(d.x, EXH - 2) : k(1, d.y)));

  const rid = Object.keys(C().rooms).find(k => allSpots(k).some(s => s.id === id));
  const sp = rid && allSpots(rid).find(s => s.id === id);
  if (!sp || S.turns <= 0 || has(S.searched, sp.id) || S.locks[rid]) return false;
  Sound.step(); S.searched.push(sp.id);
  if (has(S.lost || [], sp.id)) toast("한발 늦었다 — 누군가 이미 치워 버렸다. 단서를 놓쳤다.", true);
  else addClue(sp.clue);

  /* ---------- 주인공 이동 ---------- */

    if (S.locks[d.to]) { toast(`${esc(C().rooms[d.to].name)}은(는) 잠겨 있다. ${S.locks[d.to]}턴 뒤에 열린다.`, true); Sound.wrong(); me.path = null; return; }

  function go(t) {

    if (t.kind === "floor") { if (walkable(L, t.x, t.y) && !doorAt(L, t.x, t.y)) walkTo([[t.x, t.y]]); return; }

    if (has(S.searched, t.ref.spot)) return `${t.ref.label} · 이미 조사함`;

  }

  /* ---------- 그리기 ---------- */
  function drawSprite(sp, dir, frameT, fx, fy, dy = 0) {
    const seq = [0, 1, 0, 2], f = (frameT ? seq[Math.floor(frameT) % 4] : 0) || 0;

  }
  function draw(t) {

    if (key !== bgKey || !bg) { bgKey = key; buildBg(); }
    g.drawImage(bg, 0, 0);
    /* 가구 */
    for (const it of L.items) {
      const f = furnPixel(it.type); if (!f.ready) continue;

    }
    for (const d of L.deco) { const f = furnPixel(d.type); if (f.ready) g.drawImage(f.cv, d.x * TS, d.y * TS); }
    /* 인물: 위에서부터 차례로 */
    const ents = [];
    for (const n of npcs) ents.push({ y: n.fy, draw: () => drawSprite(charSprites(n.p.name, n.p.role), n.dir, n.frameT, n.fx, n.fy) });
    for (const h of Object.values(helpers)) if (h.room === S.room) {
      const rummage = h.cur && h.timer > 0 ? (Math.floor(t / 180) % 2) : 0;
      ents.push({ y: h.fy, draw: () => drawSprite(charSprites(h.p.name, h.p.role), h.dir, h.frameT || rummage * 1, h.fx, h.fy, rummage) });
    }
    for (const c of cops) { const x = patrolOf(c.id); ents.push({ y: c.fy, draw: () => drawSprite(charSprites(x.name, x.title), c.dir, c.frameT, c.fx, c.fy) }); }

    ents.push({ y: me.fy, draw: () => drawSprite(charSprites(pname(), "", true), me.dir, me.frameT, me.fx, me.fy) });
    ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());

      else { g.fillRect(X - 1, Y - 2, 3, 1); g.fillRect(X + 1, Y - 1, 1, 1); g.fillRect(X, Y, 1, 1); g.fillRect(X, Y + 2, 1, 1); }

  /* 이름표·말풍선·문 이름(글자는 화면 위에 얹는다) */

    for (const h of Object.values(helpers)) if (h.room === S.room) list.push(["h" + h.pid, h.fx + .5, h.fy - .2, `${h.p.name} · ${h.state === "out" ? "보고 완료!" : (S.missions.find(m => m.pid === h.pid) || {}).role === "autopsy" ? "감식 중…" : roleOf(h.pid) === "clear" ? "치우는 중…" : "바로잡는 중…"}`, "nm ally" + (h.state === "out" ? " done" : "")]);
    for (const it of L.items) if (has(S.marked || [], it.spot) && !has(S.searched, it.spot)) list.push(["mk" + it.spot, it.x + .5, it.y - .75, "놓친 곳!", "nm silent"]);
    for (const c of cops) list.push(["cop" + c.id, c.fx + .5, c.fy - .2, `${patrolOf(c.id).name} · ${c.leaving ? "이동 중" : "순찰"}`, "nm ally"]);

  /* ---------- 반복 ---------- */

    const kd = keys.up ? [0, -1] : keys.down ? [0, 1] : keys.left ? [-1, 0] : keys.right ? [1, 0] : null;
    if (!me.seg) {
      if (me.path && me.path.length) {
        const [nx, ny] = me.path[0], L = layout(S.room), d = doorAt(L, nx, ny);
        if (d) { me.path = null; goDoor(d); return; }
        if (!walkable(L, nx, ny)) { const after = me.after, goals = [me.path[me.path.length - 1]]; me.path = null; setTimeout(() => walkTo(goals, after), 300); }
        else { me.path.shift(); me.dir = dirOf(nx - S.pos.x, ny - S.pos.y); trail(S.pos.x, S.pos.y); me.seg = [nx, ny]; S.pos = { room: S.room, x: nx, y: ny }; }

      me.frameT += dt * 9;

      else { me.fx += dx / d * st; me.fy += dy / d * st; }
    } else if (!kd) me.frameT = 0;

    updateBuddy(dt);

    draw(t);

  function tileFromEvent(e) {

  }

    go, act,

    buddy() { return { on: buddy.on, x: +buddy.fx.toFixed(2), y: +buddy.fy.toFixed(2), q: buddy.q.length }; },
    debug() { return { me: { x: S.pos && S.pos.x, y: S.pos && S.pos.y, fx: +me.fx.toFixed(2), fy: +me.fy.toFixed(2), dir: me.dir, walking: !!(me.seg || (me.path && me.path.length)) },

})();

/* ===================== 팀원과 대화: 조사한 걸 힌트로 준다 (턴 소모 없음) ===================== */

  if (who === "seo") {
    const real = realLeft(rid), fakes = ((S.fakes || {})[rid] || []).filter(f => !has(S.searched, f.id));
    const r = (hashStr(rid + "|" + S.found.length + "|" + S.fakeSeed) % 100) / 100, sharp = starSlot("seo") ? 1 : .75;
    if (real.length) {

      + (p.qs.some(q => has(S.asked, q.id)) ? pressBtn(sid) : "")

  return `<section class="panel board-panel"><h3>수사 보드 <span class="hint">· 붉은 실 = 증거로 밝힌 거짓말 · 점선 = 그 사람의 방에서 나온 증거</span></h3>

function drawBoard() {
  const cork = document.getElementById("cork"), svg = document.getElementById("strings"); if (!cork || !svg) return;
  const c = C(), R = cork.getBoundingClientRect(), pos = el => { const b = el.getBoundingClientRect(); return [b.left - R.left + b.width / 2, b.top - R.top, b.bottom - R.top]; };
  svg.setAttribute("width", R.width); svg.setAttribute("height", R.height);
  const lines = [];
  for (const id of S.found) {
    const card = cork.querySelector(`[data-clue="${id}"]`); if (!card) continue;
    const [cx, ct] = pos(card);
    /* 증거로 무너뜨린 거짓말: 붉은 실 */
    for (const [sid, p] of Object.entries(c.suspects)) {
      const hit = p.qs.some(q => q.lie && has(S.broken, q.id) && q.lie.clues.includes(id));
      const owner = roomPeople(c.clues[id].room).some(pp => pp.id === sid);
      if (!hit && !owner) continue;
      const ph = cork.querySelector(`[data-sid="${sid}"]`); if (!ph) continue;
      const [px, , pb] = pos(ph), mid = (pb + ct) / 2 + 18;
      lines.push(`<path d="M${cx} ${ct + 4} Q${(cx + px) / 2} ${mid} ${px} ${pb - 4}" class="${hit ? "red" : "dash"}"/>`);
    }
  }
  svg.innerHTML = lines.join("");
}

function judge() {
  const c = C(), pk = S.pick, A = c.answer;
  const ok = { c: pk.culprit === A.culprit, m: pk.motive === A.motive, w: pk.method === A.method };
  if (!ok.c) {
    S.chances -= 1; S.wrongAccuse += 1;
    if (S.chances > 0) {   /* 어려움: 한 번 더 */
      const wrongId = pk.culprit;
      S.cleared.push(wrongId); S.pick.culprit = "";
      toast(`<b>틀렸다!</b> ${esc(EUN(c.suspects[wrongId].name))} 범인이 아니다. 남은 지목 기회 ${S.chances}번.`, true); Sound.wrong();
      if (S.turns > 0) penalty("범인을 잘못 지목했다");
      return;
    }
    S.screen = "gameover"; saveRecord(c.id, "F"); logCase(false, "F"); Sound.verdict(false);
    return;
  }
  const evGood = pk.evidence.filter(e => c.key.includes(e)).length;
  let score = 40 + (ok.m ? 15 : 0) + (ok.w ? 15 : 0) + Math.min(evGood, 3) * 5 + Math.min(S.broken.length, 3) * 3 + Math.min(S.turns, 6) - S.wrong * 2
    + DIFF[S.diff].bonus + (S.timeLeft > 0 ? 5 : 0) + (S.accCaught ? 4 : 0) + Math.min(S.secrets.length, 2) * 2 - S.wrongAccuse * 10;
  score = Math.max(0, Math.min(100, score));
  const grade = score >= 92 ? "S" : score >= 78 ? "A" : score >= 62 ? "B" : "C";
  S.result = { ...ok, evGood, score, grade };
  S.screen = "result";
  saveRecord(c.id, grade);
  S.result.newAch = logCase(true, grade).map(a => a.id);
  Sound.verdict(true);
}

function renderGameOver() {
  const c = C(), pk = S.pick, ans = c.answer, cul = c.suspects[ans.culprit];
  const motive = (c.motives.find(m => m.id === ans.motive) || {}).text || "";

function confront(qid, clueId) {
  const f = findQ(qid); if (!f) return;
  const { q, p, sid } = f;
  if (S.turns <= 0 || has(S.broken, q.id) || S.silence[sid]) return;
  S.dlg = null;
  const clueName = C().clues[clueId] ? C().clues[clueId].name : "";
  if (q.lie && q.lie.clues.includes(clueId)) {
    S.broken.push(q.id); addTl(q.lie.tl);
    S.lastLine = { sid, q: `‘${clueName}’을(를) 들이밀었다.`, a: q.lie.reply, kind: "broken" };
    toast(`<b>모순!</b> ${esc(p.name)}의 진술이 무너졌다.`); Sound.lie(); flash(); slam("모순!", `${p.name}의 진술이 무너졌다`);
    spend();
  } else {
    S.wrong += 1;
    S.lastLine = { sid, q: `‘${clueName}’을(를) 들이밀었다.`, a: p.deflect, kind: "deflect" };
    toast(`${esc(EUN(p.name))} 꿈쩍도 하지 않는다.`, true); Sound.wrong();
    spend();
    penalty("틀린 추리였다");
  }
}

  else if (d.act === "retry") { retryCase(); top = true; Sound.thunder(); flash(); }

/* ===================== 비 효과 ===================== */
(function rain() {
  const cv = document.getElementById("rain"), ctx = cv.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let lastT = 0;
  let W, H, drops;
  const size = () => {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    drops = Array.from({ length: Math.round(W * H / (W < 700 ? 16000 : 9000)) }, () => ({ x: Math.random() * W, y: Math.random() * H, l: 8 + Math.random() * 14, v: 6 + Math.random() * 6 }));
  };
  size(); addEventListener("resize", size);
  const color = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim() || "#8395a2";
  (function tick(t) {
    requestAnimationFrame(tick);
    if (LOWFX) { if (cv.style.display !== "none") cv.style.display = "none"; return; } else if (cv.style.display) cv.style.display = "";
    if (t - lastT < 33) return; lastT = t;   /* 배경 비는 초당 30번이면 충분 */
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.beginPath();
    for (const d of drops) {
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 2, d.y + d.l);
      d.y += d.v; d.x -= 0.6;
      if (d.y > H) { d.y = -d.l; d.x = Math.random() * W; }
    }
    ctx.stroke();
  })(0);
})();

/* 페이지 업데이트 시 진행 상태 유지 */
window.claude?.hot?.snapshot?.(() => S);
const start = data => { if (data && data.screen && (["title", "files"].includes(data.screen) || caseById(data.caseId) || data.randomCase)) S = Object.assign(fresh(), data); else S.screen = "opening"; render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
