<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한밤의 사건 파일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 수사 수첩 — 상단 상황판(남은 턴), 탭 네비, 본문은 현장 평면도 + 조사 패널 */
:root {
  --bg: #11171c;
  --surface: #19222a;
  --surface-2: #212c35;
  --line: #2f3d48;
  --ink: #dbe3e8;
  --muted: #8395a2;
  --lamp: #e2b25c;
  --lamp-dim: #6b5530;
  --blood: #d06a5c;
  --ok: #7fb59a;
  --f-display: "Gowun Batang", "Nanum Myeongjo", "Batang", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; position: relative; z-index: 1; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 46px); letter-spacing: -0.01em; }
h2 { font-size: 24px; }
h3 { font-size: 18px; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

#rain { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .35; }
@media (prefers-reduced-motion: reduce) { #rain { display: none; } }

.btn { background: var(--lamp); color: #1a1408; border: 0; border-radius: 4px; padding: 11px 20px; font-weight: 600; justify-self: start; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--lamp); border: 1px solid var(--lamp-dim); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* 사건 목록 */
.files { display: grid; gap: 22px; padding-block: 24px; }
.files .lede { font-family: var(--f-display); font-size: 18px; max-width: 60ch; }
.file-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.file {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; text-align: left;
  padding: 16px; display: grid; gap: 6px; align-content: start;
}
.file:hover { border-color: var(--lamp-dim); }
.file .no { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.file b { font-family: var(--f-display); font-size: 20px; }
.file .where { color: var(--muted); font-size: 13.5px; }
.stamp { justify-self: start; font-family: var(--f-mono); font-size: 12px; border-radius: 3px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); }
.stamp.solved { border-color: var(--lamp-dim); color: var(--lamp); }
.rules { display: grid; gap: 8px; max-width: 64ch; color: var(--muted); }
.rules b { color: var(--ink); font-weight: 600; }

/* 브리핑 */
.intro { display: grid; gap: 22px; padding-block: 24px; }
.intro .lede { font-family: var(--f-display); font-size: 18px; max-width: 60ch; }
.intro .brief { display: grid; gap: 10px; max-width: 62ch; color: var(--muted); }
.cast { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.cast .person { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 2px; }
.cast .person b { font-family: var(--f-display); font-size: 17px; }
.cast .person span { color: var(--muted); font-size: 13.5px; }

/* 상황판 */
.board { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: grid; gap: 12px; padding-block: 12px; }
.board-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.board-top h2 { font-size: 22px; }
.clock { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pips { display: flex; flex-wrap: wrap; gap: 3px; max-width: 280px; }
.pip { width: 6px; height: 14px; border-radius: 1px; background: var(--lamp); }
.pip.used { background: var(--line); }
.clock .mono { font-size: 13px; color: var(--muted); }
.clock .mono b { color: var(--lamp); font-weight: 500; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 6px 12px; color: var(--muted); font-size: 14px; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--line); background: var(--surface); }
.tab:disabled { opacity: .4; cursor: not-allowed; }
.tab .count { font-family: var(--f-mono); font-size: 11px; color: var(--lamp); margin-left: 4px; }
.tab.quit { margin-left: auto; }

/* 평면도 */
.split { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 20px; }
@media (max-width: 720px) { .split { grid-template-columns: minmax(0, 1fr); } }
.plan { display: grid; gap: 14px; }
.floor { display: grid; gap: 6px; }
.floor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; border: 1px solid var(--line); padding: 4px; border-radius: 3px; }
.room { background: var(--surface); border: 1px solid transparent; border-radius: 2px; padding: 10px; text-align: left; min-height: 64px; display: grid; align-content: space-between; gap: 4px; }
.room:hover { border-color: var(--line); }
.room[aria-pressed="true"] { border-color: var(--lamp); background: var(--surface-2); }
.room .rname { font-family: var(--f-display); font-size: 15px; }
.room .rstat { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.room.crime .rname::after { content: " ✕"; color: var(--blood); }
.room.wide { grid-column: span 2; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.panel .desc { color: var(--muted); max-width: 62ch; }
.spots { display: grid; gap: 10px; }
.spot { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.spot-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.spot-head b { font-weight: 600; }
.act { background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 5px 12px; font-size: 13.5px; }
.act:hover:not(:disabled) { border-color: var(--lamp); color: var(--lamp); }
.act:disabled { opacity: .45; cursor: not-allowed; }
.act.press { border-color: var(--blood); color: var(--blood); }
.act.press:hover:not(:disabled) { border-color: var(--blood); color: var(--ink); background: var(--blood); }
.act .cost { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 6px; }
.result { font-family: var(--f-display); font-size: 15.5px; line-height: 1.75; max-width: 64ch; }
.found-chip { display: inline-flex; align-items: center; gap: 6px; justify-self: start; font-family: var(--f-mono); font-size: 12px; color: var(--lamp); border: 1px solid var(--lamp-dim); border-radius: 999px; padding: 2px 10px; }

/* 심문 */
.people { display: grid; gap: 6px; }
.who { background: var(--surface); border: 1px solid transparent; border-radius: 3px; text-align: left; padding: 10px 12px; display: grid; gap: 2px; }
.who:hover { border-color: var(--line); }
.who[aria-pressed="true"] { border-color: var(--lamp); }
.who b { font-family: var(--f-display); font-size: 16px; }
.who span { font-size: 13px; color: var(--muted); }
.qa { display: grid; gap: 14px; }
.q { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.q .ask { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.q .ask .text { font-weight: 500; }
.q .tag { font-family: var(--f-mono); font-size: 11px; color: var(--lamp); }
.answer { font-family: var(--f-display); font-size: 15.5px; line-height: 1.75; border-left: 2px solid var(--lamp-dim); padding-left: 12px; max-width: 64ch; }
.answer.retracted { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--blood); }
.answer.broken { border-left-color: var(--blood); }
.answer.deflect { border-left-color: var(--line); color: var(--muted); font-size: 14.5px; }
.verdict-tag { font-family: var(--f-mono); font-size: 11px; color: var(--blood); letter-spacing: .08em; }
.present { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface-2); border: 1px dashed var(--blood); border-radius: 3px; padding: 10px; }
.present label { font-size: 13.5px; color: var(--muted); }
.present select { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px; max-width: 100%; min-width: 0; }
.q-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.locked { color: var(--muted); font-size: 13.5px; }

/* 수첩 */
.notes { display: grid; gap: 20px; margin-top: 20px; }
.clue-list { display: grid; gap: 10px; }
.clue { background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; display: grid; gap: 4px; }
.clue .meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.clue b { font-family: var(--f-display); font-size: 16px; }
.clue p { color: var(--muted); font-size: 14px; }
.timeline { display: grid; border-left: 1px solid var(--line); margin-left: 6px; }
.tl { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 6px 0 6px 14px; position: relative; }
.tl::before { content: ""; position: absolute; left: -4px; top: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--lamp-dim); }
.tl .t { font-family: var(--f-mono); font-size: 13px; color: var(--lamp); }
.tl .src { color: var(--muted); font-size: 12.5px; }
.tl.false .e { text-decoration: line-through; text-decoration-color: var(--blood); color: var(--muted); }
.tl.false::before { background: var(--blood); }
.empty { color: var(--muted); font-style: italic; }

/* 지목 */
.accuse { display: grid; gap: 22px; margin-top: 20px; }
fieldset { border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px 16px; margin: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-family: var(--f-display); font-weight: 700; font-size: 17px; padding: 0 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 6px 4px; border-radius: 3px; cursor: pointer; }
.opt:hover { background: var(--surface-2); }
.opt input { accent-color: var(--lamp); margin-top: 5px; }
.hint { color: var(--muted); font-size: 13.5px; }

/* 결과 */
.verdict { display: grid; gap: 18px; padding-block: 24px; }
.grade { font-family: var(--f-display); font-size: 64px; line-height: 1; color: var(--lamp); }
.grade.fail { color: var(--blood); }
.score-rows { display: grid; gap: 6px; max-width: 520px; }
.score-row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.score-row .ok { color: var(--ok); } .score-row .no { color: var(--blood); }
.truth { display: grid; gap: 12px; max-width: 66ch; font-family: var(--f-display); font-size: 16px; line-height: 1.8; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--surface-2); border: 1px solid var(--lamp); color: var(--ink); border-radius: 4px; padding: 10px 16px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
.toast.bad { border-color: var(--blood); }
.toast b { color: var(--lamp); }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* =====================================================================
   사건 데이터
   - question.need : 이 단서를 찾아야 열리는 질문
   - question.lie  : 거짓 진술. clues 중 하나를 제시하면 진술이 무너지고 reply가 나온다
   - question.tl   : 답을 들으면 시간표에 기록 ([시각, 내용, 출처] 또는 그 배열)
   ===================================================================== */
const CASES = [
/* ------------------------------------------------------------------ */
{
  id: "cheongram", no: "01", title: "청람장 사건", where: "강원도 산장 · 폭우",
  tag: "사건 번호 11-10 · 강원도 청람장 · 22:41 접수",
  lede: "폭우로 산길이 끊긴 밤, 은퇴한 제약회사 회장 한도윤(68)이 자신의 서재에서 숨진 채 발견되었다.",
  brief: "당신은 우연히 같은 산장에 묵고 있던 탐정이다. 경찰은 무너진 도로를 우회해 오는 중이다.",
  floors: [
    { label: "2층", rooms: ["study", "hall", "doctor", "choi"] },
    { label: "1층", rooms: ["parlor", "kitchen", "butler"], wide: ["parlor"] },
  ],
  clues: {
    body:    { name: "시신의 상태", room: "study", text: "외상은 없다. 입술이 푸르스름하고 바닥에 구토 흔적이 있다. 오른손이 가슴을 움켜쥔 채 굳었다. 심장에 작용하는 독을 의심할 만하다." },
    cup:     { name: "반쯤 남은 찻잔", room: "study", text: "식은 홍차가 반쯤 남았다. 잔 바닥에 녹지 않은 연녹색 가루가 얇게 가라앉아 있다." },
    letter:  { name: "타다 남은 편지", room: "study", text: "벽난로 재 속 편지 조각: “…정란이의 마지막 처방전… 윤 선생, 당신이 용량을… 내일 아침 서 변호사에게 모든 기록을 넘기겠소.”" },
    diary:   { name: "피해자의 일정 수첩", room: "study", text: "오늘 날짜 칸에 만년필로 적혀 있다. “21:15 최 사장 — 투자 건 / 21:40 윤 선생 — 혈압 체크”." },
    teapot:  { name: "깨끗한 주전자", room: "kitchen", text: "서재에 냈던 주전자가 부엌에 돌아와 있다. 남은 차에서는 아무것도 나오지 않았다. 독은 주전자가 아니라 잔에 들어갔다." },
    silver:  { name: "비어 있는 은식기 서랍", room: "kitchen", text: "찬장 맨 아래 칸, 은수저와 은촛대 자리가 비어 있다. 먼지 자국으로 보아 오늘 밤 빠진 듯하다." },
    chess:   { name: "체스 기보", room: "parlor", text: "두 사람의 필체가 번갈아 적힌 기보. 첫 수 21:32, 마지막 수 22:28. 매 수마다 시각이 적혀 있고 중간에 빈 시간이 없다." },
    memo:    { name: "서지현의 쪽지", room: "parlor", text: "소파 틈의 구겨진 쪽지: “삼촌이 유언장 바꾸기 전에 꼭 얘기해야 해.”" },
    ledger:  { name: "집사의 근무 일지", room: "butler", text: "“21:00 서재 홍차(주전자·잔 1). 22:30 쟁반 회수 예정.” 21:30 이후 칸은 비어 있다." },
    stash:   { name: "숨겨진 은식기", room: "butler", text: "침대 밑 여행 가방 안에 수건으로 감싼 은수저와 은촛대. 부엌 서랍에서 사라진 것들이다." },
    bag:     { name: "왕진 가방 속 약병", room: "doctor", text: "‘디곡신(디기탈리스) 분말’ 갈색 유리병. 라벨에 오늘 날짜로 개봉 표시가 있고 거의 비었다. 병뚜껑이 없다." },
    record:  { name: "이정란 진료 기록 사본", room: "doctor", text: "3년 전 故 이정란(피해자의 아내)의 진료 기록. 마지막 처방의 용량 숫자를 수정액으로 지우고 고쳐 쓴 흔적이 있다." },
    contract:{ name: "투자 철회 통지서", room: "choi", text: "한도윤 서명이 된 투자 철회 통지서. 사본에 ‘은행 접수 완료’ 도장이 찍혀 있다. 최강호의 회사는 이 돈 없이 버티기 어렵다." },
    cap:     { name: "복도의 병뚜껑", room: "hall", text: "서재 문 앞 카펫 술 사이에 작은 갈색 유리병 뚜껑. 안쪽에 ‘…goxin’이라고 적힌 약국 라벨 조각이 붙어 있다." },
    windows: { name: "잠긴 창문들", room: "hall", text: "2층 창문은 모두 안에서 잠겨 있고 창틀에 빗물 자국도 없다. 외부 침입이 아니라 저택 안의 누군가다." },
  },
  rooms: {
    study:   { name: "서재", crime: true, desc: "벽난로에 장작이 거의 다 탔다. 한도윤 회장은 책상 앞 바닥에 쓰러져 있다. 가죽 의자, 찻잔, 펼쳐진 수첩.",
      spots: [
        { id: "s_body", label: "시신을 살핀다", clue: "body", text: "맥은 이미 없다. 외상도, 몸싸움의 흔적도 없다. 입술 색이 이상하다." },
        { id: "s_cup", label: "책상 위 찻잔을 본다", clue: "cup", text: "회장이 마시던 잔이다. 바닥에 무언가 가라앉아 있다." },
        { id: "s_fire", label: "벽난로 재를 뒤진다", clue: "letter", text: "타다 만 종이 한 장이 재 밑에 깔려 있었다. 누군가 서둘러 태우려 한 듯하다." },
        { id: "s_desk", label: "펼쳐진 수첩을 읽는다", clue: "diary", text: "회장은 꼼꼼한 사람이었다. 오늘 만날 사람과 시각이 적혀 있다." },
      ]},
    hall:    { name: "2층 복도", desc: "긴 카펫이 깔린 복도. 서재와 손님방들이 이어진다. 창밖으로 비가 거세다.",
      spots: [
        { id: "s_carpet", label: "서재 앞 카펫을 살핀다", clue: "cap", text: "손전등을 비추자 카펫 술 사이에서 작은 것이 반짝였다." },

const REC_KEY = "midnight-casefiles-v1";
const GRADE_RANK = { S: 5, A: 4, B: 3, C: 2, F: 1 };
function loadRecords() { try { return JSON.parse(localStorage.getItem(REC_KEY) || "{}") || {}; } catch { return {}; } }
function saveRecord(caseId, grade) {
  const r = loadRecords();
  if (!r[caseId] || GRADE_RANK[grade] > GRADE_RANK[r[caseId]]) r[caseId] = grade;
  try { localStorage.setItem(REC_KEY, JSON.stringify(r)); } catch {}
}
const caseById = id => CASES.find(c => c.id === id);
const turnsFor = c => {
  const spots = Object.values(c.rooms).reduce((n, r) => n + r.spots.length, 0);
  const qs = Object.values(c.suspects).reduce((n, p) => n + p.qs.length, 0);
  return Math.round((spots + qs) * 0.75) + 4;
};
const fresh = () => ({ screen: "files", caseId: null, turns: 0, maxTurns: 0, found: [], searched: [], asked: [], broken: [], wrong: 0,
  tl: [], tab: "rooms", room: null, suspect: null, challenge: null, present: "", deflectOn: null,
  pick: { culprit: "", motive: "", method: "", evidence: [] }, result: null });
let S = fresh();
const C = () => caseById(S.caseId);

function openCase(id) {
  const c = caseById(id), t = turnsFor(c);
  S = Object.assign(fresh(), { screen: "brief", caseId: id, turns: t, maxTurns: t,
    room: Object.keys(c.rooms)[0], suspect: Object.keys(c.suspects)[0] });
}
function nextCaseId() {
  const rec = loadRecords(), i = CASES.findIndex(c => c.id === S.caseId);
  for (let k = 1; k <= CASES.length; k++) {
    const c = CASES[(i + k) % CASES.length];
    if (!rec[c.id] || rec[c.id] === "F") return c.id;
  }
  return CASES[(i + 1) % CASES.length].id;
}

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const has = (arr, v) => arr.includes(v);
const findQ = id => { for (const [sid, p] of Object.entries(C().suspects)) { const q = p.qs.find(x => x.id === id); if (q) return { q, sid, p }; } };

  if (!id || has(S.found, id)) return;
  S.found.push(id);
  toast(`단서 발견: <b>${esc(C().clues[id].name)}</b>`);
}
function addTl(tl, qid) {
  if (!tl) return;
  const list = typeof tl[0] === "string" ? [tl] : tl;
  for (const [t, e, src] of list) if (!S.tl.some(x => x[0] === t && x[1] === e)) S.tl.push([t, e, src, qid || null]);
  S.tl.sort((a, b) => a[0].localeCompare(b[0]));
}
let toastTimer;
function toast(html, bad) {
  const t = document.getElementById("toast");
  t.innerHTML = html; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2800);
}

/* ===================== 렌더 ===================== */
function render() {
  if (S.screen === "files") return renderFiles();
  if (S.screen === "brief") return renderBrief();
  if (S.screen === "result") return renderResult();
  const c = C(), out = S.turns <= 0;
  const pips = Array.from({ length: S.maxTurns }, (_, i) => `<span class="pip${i >= S.turns ? " used" : ""}"></span>`).join("");
  const tabs = [["rooms", "현장 조사"], ["people", "심문"], ["notes", "수사 수첩", S.found.length], ["accuse", "범인 지목"]]
    .map(([id, label, n]) => `<button class="tab" role="tab" aria-selected="${S.tab === id}" data-tab="${id}" ${out && (id === "rooms" || id === "people") ? "disabled" : ""}>${label}${n ? `<span class="count">${n}</span>` : ""}</button>`).join("");
  const body = S.tab === "rooms" ? renderRooms(out) : S.tab === "people" ? renderPeople(out) : S.tab === "notes" ? renderNotes() : renderAccuse();
  app.innerHTML = `
    <header class="board">
      <div class="board-top">
        <h2>${c.title}</h2>
        <div class="clock" aria-label="남은 행동 ${S.turns}회">
          <div class="pips">${pips}</div>
          <span class="mono">경찰 도착까지 <b>${S.turns}</b>턴</span>
        </div>
      </div>
      <nav class="tabs" role="tablist">${tabs}<button class="tab quit" data-act="files">사건 목록</button></nav>
    </header>
    <main>${body}</main>`;
}

function renderFiles() {
  const rec = loadRecords();
  const solved = CASES.filter(c => rec[c.id] && rec[c.id] !== "F").length;
  app.innerHTML = `
    <section class="files">
      <span class="label">해결 ${solved} / ${CASES.length}</span>
      <h1>한밤의 사건 파일</h1>
      <p class="lede">범인도, 수법도, 거짓말도 사건마다 다르다. 아직 풀지 않은 사건부터 골라 보자.</p>
      <div class="file-list">
        ${CASES.map(c => {
          const g = rec[c.id];
          return `<button class="file" data-case="${c.id}">
            <span class="no">FILE ${c.no}</span><b>${c.title}</b><span class="where">${c.where}</span>
            <span class="stamp${g && g !== "F" ? " solved" : ""}">${g ? (g === "F" ? "실패 · 재도전" : `해결 · 최고 ${g}`) : "미해결"}</span>
          </button>`;
        }).join("")}
      </div>
      <div class="rules">
        <p><b>조사·심문</b> 한 번에 1턴이 지난다. 장소와 사람 사이를 오가는 건 공짜다.</p>
        <p><b>단서</b>를 찾으면 용의자에게 새로운 질문이 열린다.</p>
        <p><b>모순 지적</b> 용의자의 진술이 단서와 맞지 않는다면, 그 진술에 단서를 들이밀어라. 맞으면 숨기던 진실이 나오고, 틀리면 1턴만 날린다. 모두가 거짓말을 한다. 범인만 하는 게 아니다.</p>
        <p><b>범인 지목</b> 범인·동기·수법·결정적 증거를 고르면 등급이 매겨진다.</p>
      </div>
    </section>`;
}

function renderBrief() {
  const c = C();
  app.innerHTML = `
    <section class="intro">
      <span class="label">${c.tag}</span>
      <h1>${c.title}</h1>
      <p class="lede">${c.lede}</p>
      <div class="brief"><p>${c.brief}</p><p>주어진 시간은 <b>${S.maxTurns}턴</b>이다.</p></div>
      <div class="cast">
        ${Object.values(c.suspects).map(p => `<div class="person"><b>${p.name}</b><span>${p.role}</span><span>${p.intro}</span></div>`).join("")}
      </div>
      <div class="btn-row">
        <button class="btn" data-act="start">수사를 시작한다</button>
        <button class="btn ghost" data-act="files">사건 목록</button>
      </div>
    </section>`;
}

function roomBtn(id, wide) {
  const r = C().rooms[id];
  const done = r.spots.filter(s => has(S.searched, s.id)).length;
  return `<button class="room${r.crime ? " crime" : ""}${wide ? " wide" : ""}" aria-pressed="${S.room === id}" data-room="${id}">
    <span class="rname">${r.name}</span><span class="rstat">조사 ${done}/${r.spots.length}</span></button>`;
}
function renderRooms(out) {
  const c = C(), r = c.rooms[S.room];
  const floorOf = c.floors.find(f => f.rooms.includes(S.room));
  const spots = r.spots.map(sp => {
    const done = has(S.searched, sp.id);
    return `<div class="spot">
      <div class="spot-head"><b>${sp.label}</b>
        ${done ? "" : `<button class="act" data-search="${sp.id}" ${out ? "disabled" : ""}>조사한다<span class="cost">−1턴</span></button>`}
      </div>
      ${done ? `<p class="result">${esc(sp.text)}</p>${sp.clue ? `<span class="found-chip">단서 · ${esc(c.clues[sp.clue].name)}</span><p class="result">${esc(c.clues[sp.clue].text)}</p>` : ""}` : ""}
    </div>`;
  }).join("");
  const plan = c.floors.map(f => `<div class="floor"><span class="label">${f.label}</span>
    <div class="floor-grid">${f.rooms.map(id => roomBtn(id, (f.wide || []).includes(id))).join("")}</div></div>`).join("");
  return `<div class="split">
    <div class="plan">${plan}</div>
    <section class="panel" aria-live="polite">
      <div><span class="label">${floorOf ? floorOf.label : ""}</span><h3 style="font-size:24px">${r.name}</h3></div>
      <p class="desc">${r.desc}</p>
      <div class="spots">${spots}</div>
    </section>
  </div>`;
}

function renderQ(q, p, out) {
  const c = C(), asked = has(S.asked, q.id), broken = has(S.broken, q.id);
  let html = `<div class="q">
    <div class="ask"><span class="text">“${esc(q.q)}”</span>
      ${asked ? "" : `<button class="act" data-ask="${q.id}" ${out ? "disabled" : ""}>묻는다<span class="cost">−1턴</span></button>`}</div>
    ${q.need ? `<span class="tag">단서 · ${esc(c.clues[q.need].name)}</span>` : ""}`;
  if (asked) {
    html += `<p class="answer${broken ? " retracted" : ""}">${esc(q.a)}</p>`;
    if (broken) {
      html += `<span class="verdict-tag">진술 번복</span><p class="answer broken">${esc(q.lie.reply)}</p>`;
    } else {
      if (S.deflectOn === q.id) html += `<p class="answer deflect">${esc(p.deflect)}</p>`;
      if (S.challenge === q.id) {
        const opts = S.found.map(id => `<option value="${id}" ${S.present === id ? "selected" : ""}>${esc(c.clues[id].name)}</option>`).join("");
        html += `<div class="present">
          <label for="present-${q.id}">이 진술과 모순되는 단서</label>
          <select id="present-${q.id}" name="present">${opts}</select>
          <button class="act press" data-confront="${q.id}" ${out ? "disabled" : ""}>들이민다<span class="cost">−1턴</span></button>
          <button class="act" data-act="cancel">취소</button>
        </div>`;
      } else if (S.found.length) {
        html += `<div class="q-actions"><button class="act press" data-challenge="${q.id}" ${out ? "disabled" : ""}>모순 지적</button></div>`;
      }
    }
  }
  return html + `</div>`;
}

function renderPeople(out) {
  const c = C();
  const list = Object.entries(c.suspects).map(([id, p]) => {
    const open = p.qs.filter(q => !q.need || has(S.found, q.need));
    const left = open.filter(q => !has(S.asked, q.id)).length;
    const nb = p.qs.filter(q => has(S.broken, q.id)).length;
    return `<button class="who" aria-pressed="${S.suspect === id}" data-suspect="${id}">
      <b>${p.name}</b><span>${p.role}</span><span class="mono">새 질문 ${left}${nb ? ` · 번복 ${nb}` : ""}</span></button>`;
  }).join("");
  const p = c.suspects[S.suspect];
  let locked = 0;
  const qs = p.qs.map(q => { if (q.need && !has(S.found, q.need)) { locked++; return ""; } return renderQ(q, p, out); }).join("");
  return `<div class="split">
    <div class="people">${list}</div>
    <section class="panel" aria-live="polite">
      <div><span class="label">${p.role}</span><h3 style="font-size:24px">${p.name}</h3></div>
      <p class="desc">${p.intro}</p>
      <div class="qa">${qs}</div>
      ${locked ? `<p class="locked">단서를 더 찾으면 물어볼 것이 ${locked}개 더 생긴다.</p>` : ""}
      ${S.found.length ? "" : `<p class="locked">단서를 하나라도 찾으면 진술의 모순을 지적할 수 있다.</p>`}
    </section>
  </div>`;
}

function renderNotes() {
  const c = C();
  const clues = S.found.length
    ? S.found.map(id => `<div class="clue"><div class="meta"><b>${c.clues[id].name}</b><span class="label">${c.rooms[c.clues[id].room].name}</span></div><p>${c.clues[id].text}</p></div>`).join("")
    : `<p class="empty">아직 찾은 단서가 없다.</p>`;
  const tl = S.tl.length
    ? S.tl.map(([t, e, src, qid]) => {
        const lie = qid && has(S.broken, qid);
        return `<div class="tl${lie ? " false" : ""}"><span class="t">${t}</span><div><div class="e">${esc(e)}</div><div class="src">출처 · ${esc(src)}${lie ? " · 거짓으로 밝혀짐" : ""}</div></div></div>`;
      }).join("")
    : `<p class="empty">진술을 들으면 시간표가 채워진다.</p>`;
  return `<div class="notes">
    <section class="panel"><h3>시간표</h3><div class="timeline">${tl}</div></section>
    <section class="panel"><h3>단서 <span class="mono" style="color:var(--muted);font-size:14px">${S.found.length}/${Object.keys(c.clues).length}</span></h3><div class="clue-list">${clues}</div></section>
  </div>`;
}

function renderAccuse() {
  const c = C(), pk = S.pick;
  const radio = (name, items, cur) => items.map(o => `<label class="opt"><input type="radio" name="${name}" id="${name}-${o.id}" value="${o.id}" ${cur === o.id ? "checked" : ""}><span>${esc(o.text)}</span></label>`).join("");
  const suspects = Object.entries(c.suspects).map(([id, p]) => ({ id, text: `${p.name} — ${p.role}` }));
  const ev = S.found.length
    ? S.found.map(id => `<label class="opt"><input type="checkbox" name="evidence" id="ev-${id}" value="${id}" ${has(pk.evidence, id) ? "checked" : ""} ${!has(pk.evidence, id) && pk.evidence.length >= 3 ? "disabled" : ""}><span>${esc(c.clues[id].name)}</span></label>`).join("")
    : `<p class="empty">찾은 단서가 없다. 증거 없이 지목할 수도 있지만 설득력이 떨어진다.</p>`;
  const ready = pk.culprit && pk.motive && pk.method;
  return `<form class="accuse" id="accuse-form">
    ${S.turns > 0 ? `<p class="hint">지목하면 수사가 끝난다. 아직 ${S.turns}턴이 남아 있다.</p>` : `<p class="hint">경찰이 도착했다. 지금 가진 것으로 결론을 내려야 한다.</p>`}
    <fieldset><legend>범인은 누구인가</legend>${radio("culprit", suspects, pk.culprit)}</fieldset>
    <fieldset><legend>동기</legend>${radio("motive", c.motives, pk.motive)}</fieldset>
    <fieldset><legend>수법</legend>${radio("method", c.methods, pk.method)}</fieldset>
    <fieldset><legend>결정적 증거 (최대 3개)</legend>${ev}</fieldset>
    <button class="btn" type="submit" ${ready ? "" : "disabled"}>이 사람이 범인이다</button>
  </form>`;
}

function judge() {
  const c = C(), pk = S.pick, A = c.answer;
  const ok = { c: pk.culprit === A.culprit, m: pk.motive === A.motive, w: pk.method === A.method };
  const evGood = pk.evidence.filter(e => c.key.includes(e)).length;
  let score = 0;
  if (ok.c) score = 40 + (ok.m ? 15 : 0) + (ok.w ? 15 : 0) + Math.min(evGood, 3) * 5 + Math.min(S.broken.length, 3) * 3 + Math.min(S.turns, 6) - S.wrong * 2;
  score = Math.max(0, Math.min(100, score));
  const grade = !ok.c ? "F" : score >= 92 ? "S" : score >= 78 ? "A" : score >= 62 ? "B" : "C";
  S.result = { ...ok, evGood, score, grade };
  S.screen = "result";
  saveRecord(c.id, grade);
}

function renderResult() {
  const c = C(), R = S.result, pk = S.pick, name = c.suspects[pk.culprit].name, real = c.suspects[c.answer.culprit].name;
  const row = (label, ok, val) => `<div class="score-row"><span>${label}</span><span class="${ok ? "ok" : "no"}">${val}</span></div>`;
  const headline = !R.c ? `${name}은(는) 범인이 아니었다. 진범은 ${real}.`
    : R.grade === "S" ? `완벽한 추리. ${real}은(는) 더 이상 변명하지 못했다.`
    : R.grade === "A" ? "범인을 잡았다. 법정에서도 충분히 버틸 추리다."
    : "범인은 맞혔지만, 변호사가 빈틈을 파고들 것이다.";
  const next = caseById(nextCaseId());
  app.innerHTML = `<section class="verdict">
    <span class="label">${c.title} · 수사 결과</span>
    <div class="grade${R.c ? "" : " fail"}">${R.grade}</div>
    <h2>${headline}</h2>
    <div class="score-rows">
      ${row("범인", R.c, name)}
      ${row("동기", R.m, R.m ? "정답" : "오답")}
      ${row("수법", R.w, R.w ? "정답" : "오답")}
      ${row("결정적 증거", R.evGood > 0, `${R.evGood} / ${Math.max(pk.evidence.length, 1)} 유효`)}
      ${row("무너뜨린 거짓말", S.broken.length > 0, `${S.broken.length}개`)}
      ${row("헛짚은 지적", S.wrong === 0, `${S.wrong}회`)}
      ${row("남은 턴", S.turns > 0, `${S.turns}`)}
      <div class="score-row"><b>점수</b><b class="mono">${R.score}</b></div>
    </div>
    <h3>사건의 진상</h3>
    <div class="truth">${c.truth.map(t => `<p>${esc(t)}</p>`).join("")}</div>
    <div class="btn-row">
      <button class="btn" data-case="${next.id}">다음 사건: ${next.title}</button>
      <button class="btn ghost" data-act="files">사건 목록</button>
      <button class="btn ghost" data-case="${c.id}">이 사건 다시 하기</button>
    </div>
  </section>`;
}

/* ===================== 이벤트 ===================== */
app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  let top = false;
  if (d.case) { openCase(d.case); top = true; }
  else if (d.act === "start") { S.screen = "game"; top = true; }
  else if (d.act === "files") { S = fresh(); top = true; }
  else if (d.act === "cancel") { S.challenge = null; }
  else if (d.tab) { S.tab = d.tab; S.challenge = null; }
  else if (d.room) { S.room = d.room; }
  else if (d.suspect) { S.suspect = d.suspect; S.challenge = null; S.deflectOn = null; }
  else if (d.search) {
    const sp = Object.values(C().rooms).flatMap(r => r.spots).find(s => s.id === d.search);
    if (S.turns <= 0 || has(S.searched, sp.id)) return;
    S.searched.push(sp.id); addClue(sp.clue); spend();
  } else if (d.ask) {
    const { q } = findQ(d.ask);
    if (S.turns <= 0 || has(S.asked, q.id)) return;
    S.asked.push(q.id); addTl(q.tl, q.lie ? q.id : null); spend();
  } else if (d.challenge) {
    S.challenge = d.challenge; S.present = S.found[0] || ""; S.deflectOn = null;
  } else if (d.confront) {
    const { q, p } = findQ(d.confront);
    if (S.turns <= 0 || has(S.broken, q.id) || !S.present) return;
    S.challenge = null;
    if (q.lie && q.lie.clues.includes(S.present)) {
      S.broken.push(q.id); addTl(q.lie.tl);
      toast(`<b>모순!</b> ${esc(p.name)}의 진술이 무너졌다.`);
    } else {
      S.wrong += 1; S.deflectOn = q.id;
      toast(`${esc(p.name)}은(는) 꿈쩍도 하지 않는다.`, true);
    }
    spend();
  } else return;
  render();
  if (top) window.scrollTo(0, 0);
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "present") { S.present = t.value; return; }
  if (t.name === "evidence") S.pick.evidence = [...app.querySelectorAll('input[name="evidence"]:checked')].map(i => i.value);
  else if (["culprit", "motive", "method"].includes(t.name)) S.pick[t.name] = t.value;
  else return;
  render();
});
app.addEventListener("submit", e => {
  e.preventDefault();
  const pk = S.pick; if (!(pk.culprit && pk.motive && pk.method)) return;
  judge(); render(); window.scrollTo(0, 0);
});

/* ===================== 비 효과 ===================== */
(function rain() {
  const cv = document.getElementById("rain"), ctx = cv.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let W, H, drops;
  const size = () => {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    drops = Array.from({ length: Math.round(W * H / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * H, l: 8 + Math.random() * 14, v: 6 + Math.random() * 6 }));
  };
  size(); addEventListener("resize", size);
  const color = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim() || "#8395a2";
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.beginPath();
    for (const d of drops) {
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 2, d.y + d.l);
      d.y += d.v; d.x -= 0.6;
      if (d.y > H) { d.y = -d.l; d.x = Math.random() * W; }
    }
    ctx.stroke(); requestAnimationFrame(tick);
  })();
})();

/* 페이지 업데이트 시 진행 상태 유지 */
window.claude?.hot?.snapshot?.(() => S);
const start = data => { if (data && data.screen && (data.screen === "files" || caseById(data.caseId))) S = Object.assign(fresh(), data); render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
