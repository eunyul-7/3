<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청람장 사건</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 수사 수첩 — 상단 상황판(남은 턴), 탭 네비, 본문은 저택 평면도 + 조사 패널 */
:root {
  --bg: #11171c;          /* 비 내리는 밤 */
  --surface: #19222a;     /* 수첩 판 */
  --surface-2: #212c35;
  --line: #2f3d48;
  --ink: #dbe3e8;
  --muted: #8395a2;
  --lamp: #e2b25c;        /* 등불 */
  --lamp-dim: #6b5530;
  --blood: #d06a5c;
  --ok: #7fb59a;
  --f-display: "Gowun Batang", "Nanum Myeongjo", "Batang", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 46px); letter-spacing: -0.01em; }
h2 { font-size: 24px; }
h3 { font-size: 18px; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

/* 비 */
#rain { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .35; }
.wrap { position: relative; z-index: 1; }
@media (prefers-reduced-motion: reduce) { #rain { display: none; } }

/* 인트로 */
.intro { display: grid; gap: 22px; padding-block: 24px; }
.intro .lede { font-family: var(--f-display); font-size: 18px; max-width: 60ch; color: var(--ink); }
.intro .brief { display: grid; gap: 10px; max-width: 62ch; color: var(--muted); }
.cast { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.cast .person { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 2px; }
.cast .person b { font-family: var(--f-display); font-size: 17px; }
.cast .person span { color: var(--muted); font-size: 13.5px; }
.btn {
  background: var(--lamp); color: #1a1408; border: 0; border-radius: 4px;
  padding: 11px 20px; font-weight: 600; justify-self: start;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--lamp); border: 1px solid var(--lamp-dim); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* 상황판 */
.board {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  display: grid; gap: 12px; padding-block: 12px;
}
.board-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.board-top h2 { font-size: 22px; }
.clock { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pips { display: flex; flex-wrap: wrap; gap: 3px; max-width: 280px; }
.pip { width: 6px; height: 14px; border-radius: 1px; background: var(--lamp); }
.pip.used { background: var(--line); }
.clock .mono { font-size: 13px; color: var(--muted); }
.clock .mono b { color: var(--lamp); font-weight: 500; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab {
  background: transparent; border: 1px solid transparent; border-radius: 4px;
  padding: 6px 12px; color: var(--muted); font-size: 14px;
}
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--line); background: var(--surface); }
.tab .count { font-family: var(--f-mono); font-size: 11px; color: var(--lamp); margin-left: 4px; }

/* 평면도 */
.split { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 720px) { .split { grid-template-columns: minmax(0, 1fr); } }
.plan { display: grid; gap: 14px; }
.floor { display: grid; gap: 6px; }
.floor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; border: 1px solid var(--line); padding: 4px; border-radius: 3px; }
.room {
  background: var(--surface); border: 1px solid transparent; border-radius: 2px;
  padding: 10px; text-align: left; min-height: 64px; display: grid; align-content: space-between; gap: 4px;
}
.room:hover { border-color: var(--line); }
.room[aria-pressed="true"] { border-color: var(--lamp); background: var(--surface-2); }
.room .rname { font-family: var(--f-display); font-size: 15px; }
.room .rstat { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.room.crime .rname::after { content: " ✕"; color: var(--blood); }
.room.wide { grid-column: span 2; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.panel .desc { color: var(--muted); max-width: 62ch; }
.spots { display: grid; gap: 10px; }
.spot { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.spot-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.spot-head b { font-weight: 600; }
.act {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px;
  padding: 5px 12px; font-size: 13.5px;
}
.act:hover:not(:disabled) { border-color: var(--lamp); color: var(--lamp); }
.act:disabled { opacity: .45; cursor: not-allowed; }
.act .cost { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 6px; }
.result { font-family: var(--f-display); font-size: 15.5px; line-height: 1.75; max-width: 64ch; }
.found-chip {
  display: inline-flex; align-items: center; gap: 6px; justify-self: start;
  font-family: var(--f-mono); font-size: 12px; color: var(--lamp);
  border: 1px solid var(--lamp-dim); border-radius: 999px; padding: 2px 10px;
}

/* 심문 */
.people { display: grid; gap: 6px; }
.who {
  background: var(--surface); border: 1px solid transparent; border-radius: 3px; text-align: left;
  padding: 10px 12px; display: grid; gap: 2px;
}
.who:hover { border-color: var(--line); }
.who[aria-pressed="true"] { border-color: var(--lamp); }
.who b { font-family: var(--f-display); font-size: 16px; }
.who span { font-size: 13px; color: var(--muted); }
.qa { display: grid; gap: 14px; }
.q { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.q .ask { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.q .ask .text { font-weight: 500; }
.q .tag { font-family: var(--f-mono); font-size: 11px; color: var(--lamp); }
.answer { font-family: var(--f-display); font-size: 15.5px; line-height: 1.75; border-left: 2px solid var(--lamp-dim); padding-left: 12px; max-width: 64ch; }
.locked { color: var(--muted); font-size: 13.5px; }

/* 수첩 */
.notes { display: grid; gap: 20px; }
.clue-list { display: grid; gap: 10px; }
.clue { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; display: grid; gap: 4px; }
.clue .meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.clue b { font-family: var(--f-display); font-size: 16px; }
.clue p { color: var(--muted); font-size: 14px; }
.timeline { display: grid; gap: 0; border-left: 1px solid var(--line); margin-left: 6px; }
.tl { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 6px 0 6px 14px; position: relative; }
.tl::before { content: ""; position: absolute; left: -4px; top: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--lamp-dim); }
.tl .t { font-family: var(--f-mono); font-size: 13px; color: var(--lamp); }
.tl .src { color: var(--muted); font-size: 12.5px; }
.empty { color: var(--muted); font-style: italic; }

/* 고발 */
.accuse { display: grid; gap: 22px; }
fieldset { border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px 16px; margin: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-family: var(--f-display); font-weight: 700; font-size: 17px; padding: 0 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 6px 4px; border-radius: 3px; cursor: pointer; }
.opt:hover { background: var(--surface-2); }
.opt input { accent-color: var(--lamp); margin-top: 5px; }
.hint { color: var(--muted); font-size: 13.5px; }

/* 결과 */
.verdict { display: grid; gap: 18px; }
.grade { font-family: var(--f-display); font-size: 64px; line-height: 1; color: var(--lamp); }
.grade.fail { color: var(--blood); }
.score-rows { display: grid; gap: 6px; max-width: 520px; }
.score-row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.score-row .ok { color: var(--ok); } .score-row .no { color: var(--blood); }
.truth { display: grid; gap: 12px; max-width: 66ch; font-family: var(--f-display); font-size: 16px; line-height: 1.8; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--surface-2); border: 1px solid var(--lamp); color: var(--ink);
  border-radius: 4px; padding: 10px 16px; font-size: 14px; max-width: calc(100% - 32px);
  box-shadow: 0 8px 30px rgba(0,0,0,.4);
}
.toast b { color: var(--lamp); }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ===================== 사건 데이터 ===================== */
const MAX_TURNS = 28;

const CLUES = {
  body:    { name: "시신의 상태", room: "study", text: "외상은 없다. 입술이 푸르스름하고 바닥에 구토 흔적이 있다. 오른손이 가슴을 움켜쥔 채 굳었다. 심장에 작용하는 독을 의심할 만하다." },
  cup:     { name: "반쯤 남은 찻잔", room: "study", text: "식은 홍차가 반쯤 남았다. 잔 바닥에 녹지 않은 연녹색 가루가 얇게 가라앉아 있다." },

  diary:   { name: "피해자의 일정 수첩", room: "study", text: "오늘 날짜 칸에 만년필로 적혀 있다. “21:15 최 사장 — 투자 건 / 21:40 윤 선생 — 혈압 체크”." },
  teapot:  { name: "깨끗한 주전자", room: "kitchen", text: "서재에 냈던 주전자가 부엌에 돌아와 있다. 남은 차에서는 아무것도 나오지 않았다. 독은 주전자가 아니라 잔에 들어갔다." },
  silver:  { name: "비어 있는 은식기 서랍", room: "kitchen", text: "찬장 맨 아래 칸, 은수저와 은촛대 자리가 비어 있다. 먼지 자국으로 보아 오늘 밤 빠진 듯하다." },
  chess:   { name: "체스 기보", room: "parlor", text: "두 사람의 필체가 번갈아 적힌 기보. 첫 수 21:32, 마지막 수 22:28. 매 수마다 시각이 적혀 있고 중간에 빈 시간이 없다." },

  ledger:  { name: "집사의 근무 일지", room: "butler", text: "“21:00 서재 홍차(주전자·잔 1). 22:30 쟁반 회수 예정.” 21:30 이후 칸은 비어 있다." },
  stash:   { name: "숨겨진 은식기", room: "butler", text: "침대 밑 여행 가방 안에 수건으로 감싼 은수저와 은촛대. 부엌 서랍에서 사라진 것들이다." },
  bag:     { name: "왕진 가방 속 약병", room: "doctor", text: "‘디곡신(디기탈리스) 분말’ 갈색 유리병. 라벨에 오늘 날짜로 개봉 표시가 있고 거의 비었다. 병뚜껑이 없다." },
  record:  { name: "이정란 진료 기록 사본", room: "doctor", text: "3년 전 故 이정란(피해자의 아내)의 진료 기록. 마지막 처방의 용량 숫자를 수정액으로 지우고 고쳐 쓴 흔적이 있다." },
  contract:{ name: "투자 철회 통지서", room: "choi", text: "한도윤 서명이 된 투자 철회 통지서. 사본에 ‘은행 접수 완료’ 도장이 찍혀 있다. 최강호의 회사는 이 돈 없이 버티기 어렵다." },

  windows: { name: "잠긴 창문들", room: "hall", text: "2층 창문은 모두 안에서 잠겨 있고 창틀에 빗물 자국도 없다. 외부 침입이 아니라 저택 안의 누군가다." },

const ROOMS = {
  study:   { name: "서재", floor: 2, crime: true,
    desc: "벽난로에 장작이 거의 다 탔다. 한도윤 회장은 책상 앞 바닥에 쓰러져 있다. 가죽 의자, 찻잔, 펼쳐진 수첩.",

      { id: "s_fire", label: "벽난로 재를 뒤진다", clue: "letter", text: "타다 만 종이 한 장이 재 밑에 깔려 있었다. 누군가 서둘러 태우려 한 듯하다." },

    ]},
  hall:    { name: "2층 복도", floor: 2,
    desc: "긴 카펫이 깔린 복도. 서재와 손님방들이 이어진다. 창밖으로 비가 거세다.",
    spots: [
      { id: "s_carpet", label: "서재 앞 카펫을 살핀다", clue: "cap", text: "손전등을 비추자 카펫 술 사이에서 작은 것이 반짝였다." },

  doctor:  { name: "윤채린의 방", floor: 2,
    desc: "주치의 윤채린이 묵는 손님방. 침대는 정돈되어 있고 책상 위에 의학 저널이 펼쳐져 있다.",
    spots: [
      { id: "s_bag", label: "왕진 가방을 연다", clue: "bag", text: "청진기, 혈압계, 약병 몇 개. 그중 하나가 눈에 띈다." },
      { id: "s_drawer", label: "책상 서랍을 연다", clue: "record", text: "서류 봉투 안에 낡은 진료 기록 사본이 들어 있다." },
    ]},
  choi:    { name: "최강호의 방", floor: 2,
    desc: "동업자 최강호가 묵는 손님방. 서류 가방이 열려 있고, 재떨이에 꽁초가 수북하다.",

      { id: "s_brief", label: "서류 가방을 뒤진다", clue: "contract", text: "맨 위에 구겨졌다 다시 편 서류가 있다." },
      { id: "s_ash", label: "재떨이와 휴지통을 본다", clue: null, text: "꽁초가 열한 개. 휴지통에는 쓰다 만 사과 편지가 있다. “회장님, 30년을 봐서라도 한 번만…” 원망보다는 애원에 가깝다." },

    ]},

      { id: "s_pot", label: "쟁반 위 주전자를 조사한다", clue: "teapot", text: "주전자에 차가 꽤 남아 있다. 집사가 같은 주전자의 차를 자기도 마셨다고 했다." },

function spend() {
  S.turns -= 1;

function addClue(id) {

  S.found.push(id);
  toast(`단서 발견: <b>${esc(CLUES[id].name)}</b>`);
}
function addTl(entry) {
  if (!entry) return;
  if (!S.tl.some(t => t[0] === entry[0] && t[1] === entry[1])) S.tl.push(entry);
  S.tl.sort((a, b) => a[0].localeCompare(b[0]));
}
let toastTimer;
function toast(html) {
  const t = document.getElementById("toast");
  t.innerHTML = html; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600);
}

function renderPeople(out) {

  return `<form class="accuse" id="accuse-form" style="margin-top:20px">
    ${S.turns > 0 ? `<p class="hint">지목하면 수사가 끝난다. 아직 ${S.turns}턴이 남아 있다.</p>` : `<p class="hint">경찰이 도착했다. 지금 가진 것으로 결론을 내려야 한다.</p>`}
    <fieldset><legend>범인은 누구인가</legend>${radio("culprit", suspects, pk.culprit)}</fieldset>
    <fieldset><legend>동기</legend>${radio("motive", MOTIVES, pk.motive)}</fieldset>
    <fieldset><legend>수법</legend>${radio("method", METHODS, pk.method)}</fieldset>
    <fieldset><legend>결정적 증거 (최대 3개)</legend>${ev}</fieldset>
    <button class="btn" type="submit" ${ready ? "" : "disabled"}>이 사람이 범인이다</button>
  </form>`;
}

function judge() {
  const pk = S.pick;
  const c = pk.culprit === ANSWER.culprit, m = pk.motive === ANSWER.motive, w = pk.method === ANSWER.method;
  const evGood = pk.evidence.filter(e => KEY_EVIDENCE.includes(e)).length;
  let score = 0;
  if (c) score = 40 + (m ? 20 : 0) + (w ? 20 : 0) + Math.min(evGood, 3) * 5 + Math.min(S.turns, 10);
  let grade = "F";
  if (c) grade = score >= 95 ? "S" : score >= 80 ? "A" : score >= 65 ? "B" : "C";
  S.result = { c, m, w, evGood, score, grade };
  S.screen = "result";
}

function renderResult() {
  const R = S.result, pk = S.pick;
  const row = (label, ok, val) => `<div class="score-row"><span>${label}</span><span class="${ok ? "ok" : "no"}">${val}</span></div>`;
  const headline = !R.c
    ? `${SUSPECTS[pk.culprit].name}은(는) 범인이 아니었다.`
    : R.grade === "S" ? "완벽한 추리. 윤채린은 아무 말도 하지 못했다."
    : R.grade === "A" ? "범인을 잡았다. 법정에서도 충분히 버틸 추리다."
    : "범인은 맞혔지만, 변호사가 빈틈을 파고들 것이다.";
  app.innerHTML = `<section class="verdict" style="padding-block:24px">
    <span class="label">수사 결과</span>
    <div class="grade${R.c ? "" : " fail"}">${R.grade}</div>
    <h2>${headline}</h2>
    <div class="score-rows">
      ${row("범인", R.c, SUSPECTS[pk.culprit].name)}
      ${row("동기", R.m, R.m ? "정답" : "오답")}
      ${row("수법", R.w, R.w ? "정답" : "오답")}
      ${row("결정적 증거", R.evGood > 0, `${R.evGood} / ${Math.max(pk.evidence.length, 1)} 유효`)}
      ${row("남은 턴", S.turns > 0, `${S.turns}`)}
      <div class="score-row"><b>점수</b><b class="mono">${R.score}</b></div>
    </div>
    <h3>사건의 진상</h3>
    <div class="truth">
      <p>3년 전, 한도윤의 아내 이정란은 주치의 윤채린이 잘못 계산한 디곡신 용량 때문에 세상을 떠났다. 윤채린은 진료 기록의 숫자를 고쳐 사고를 덮었다.</p>
      <p>한도윤은 3년 동안 아내의 기록을 모았고, 마침내 진실에 닿았다. 그는 다음 날 아침 변호사에게 모든 것을 넘기겠다는 편지를 썼다.</p>
      <p>21시 40분, 윤채린은 혈압을 재러 왔다는 핑계로 서재에 들어가 회장이 아직 손대지 않은 찻잔에 디곡신 분말을 털어 넣었다. 책상 위 편지를 발견하자 벽난로에 불을 피워 태웠다. 서두르다 병뚜껑을 복도에 떨어뜨렸고, 9시 50분 방으로 돌아가는 모습을 은식기를 훔치던 집사에게 들켰다.</p>
      <p>서지현의 유언장, 최강호의 투자 철회, 박만수의 은식기는 모두 진짜 비밀이었지만, 살인과는 관계가 없었다.</p>
    </div>
    <button class="btn" data-act="restart">처음부터 다시 수사한다</button>
  </section>`;
}

/* ===================== 이벤트 ===================== */
app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.act === "start") { S.screen = "game"; }
  else if (d.act === "restart") { S = fresh(); }
  else if (d.tab) { S.tab = d.tab; }
  else if (d.room) { S.room = d.room; }
  else if (d.suspect) { S.suspect = d.suspect; }
  else if (d.search) {
    const sp = Object.values(ROOMS).flatMap(r => r.spots).find(s => s.id === d.search);
    if (S.turns <= 0 || has(S.searched, sp.id)) return;
    S.searched.push(sp.id); addClue(sp.clue); spend();
  } else if (d.ask) {
    const q = SUSPECTS[S.suspect].qs.find(x => x.id === d.ask);
    if (S.turns <= 0 || has(S.asked, q.id)) return;
    S.asked.push(q.id); addTl(q.tl); spend();
  } else return;
  render();
  if (d.act) window.scrollTo(0, 0);
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "evidence") {
    S.pick.evidence = [...app.querySelectorAll('input[name="evidence"]:checked')].map(i => i.value);
  } else if (["culprit", "motive", "method"].includes(t.name)) {
    S.pick[t.name] = t.value;
  } else return;
  render();
});
app.addEventListener("submit", e => {
  e.preventDefault();
  const pk = S.pick; if (!(pk.culprit && pk.motive && pk.method)) return;
  judge(); render(); window.scrollTo(0, 0);
});

/* ===================== 비 효과 ===================== */
(function rain() {
  const cv = document.getElementById("rain"), ctx = cv.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let W, H, drops;
  const size = () => {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    drops = Array.from({ length: Math.round(W * H / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * H, l: 8 + Math.random() * 14, v: 6 + Math.random() * 6 }));
  };
  size(); addEventListener("resize", size);
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim() || "#8395a2";
    ctx.lineWidth = 1; ctx.beginPath();
    for (const d of drops) {
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 2, d.y + d.l);
      d.y += d.v; d.x -= 0.6;
      if (d.y > H) { d.y = -d.l; d.x = Math.random() * W; }
    }
    ctx.stroke(); requestAnimationFrame(tick);
  })();
})();

/* 페이지 업데이트 시 진행 상태 유지 */
window.claude?.hot?.snapshot?.(() => S);
const start = data => { if (data && data.screen) S = Object.assign(fresh(), data); render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
